<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library — Film Trend</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f2a33c'/><path d='M12 9l12 7-12 7z' fill='%230b0d12'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <section class="page-hero">
    <div class="wrap">
      <h1>The Library</h1>
      <p>Every indexed title — feature films, commercials and music videos. Open one to browse all of its shots.</p>
    </div>
  </section>

  <main class="wrap" style="padding-bottom:80px">
    <div class="filter-opts" id="src-tabs" style="justify-content:center;margin-bottom:32px">
      <button class="fopt on" data-src="">All</button>
      <button class="fopt" data-src="Film">Films</button>
      <button class="fopt" data-src="Commercial">Commercials</button>
      <button class="fopt" data-src="Music Video">Music Videos</button>
    </div>
    <div class="movies-grid" id="movies-grid"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/ui.js"></script>
  <script>
    function movieCard(m) {
      const hero = SHOTS.find(s => s.movie === m.slug);
      const count = SHOTS.filter(s => s.movie === m.slug).length;
      const el = document.createElement("a");
      el.className = "movie-card";
      el.href = `movie.html?m=${m.slug}`;
      el.innerHTML = `
        <div class="poster">${sceneSVG(hero, 3)}</div>
        <div class="info">
          <b>${m.title}</b>
          <span>${m.year} · Dir. ${m.director}</span>
          <div class="tags">
            <span class="tag">${m.src}</span>
            <span class="tag">${m.genre}</span>
            <span class="tag">${count} shots</span>
          </div>
        </div>`;
      return el;
    }

    function renderMovies(src) {
      const grid = document.getElementById("movies-grid");
      grid.innerHTML = "";
      MOVIES.filter(m => !src || m.src === src).forEach(m => grid.appendChild(movieCard(m)));
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderMovies("");
      document.getElementById("src-tabs").addEventListener("click", e => {
        const b = e.target.closest(".fopt");
        if (!b) return;
        document.querySelectorAll("#src-tabs .fopt").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        renderMovies(b.dataset.src);
      });
    });
  </script>
</body>
</html>
