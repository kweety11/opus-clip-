<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film-trend AI</title>
  <meta name="description" content="خطة سوشيال ميديا، سيناريو، استوري بورد ببرومبتات جاهزة، وفويس أوفر بأصوات جوجل — بأي موديل AI في السوق.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%237c3aed'/><stop offset='1' stop-color='%23ec4899'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><text x='16' y='23' text-anchor='middle' font-size='18'>🎬</text></svg>">
  <meta name="theme-color" content="#7c3aed">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   FILM-TREND AI — premium AI-studio design system (RTL + LTR)
   Type: Cairo · deep-space palette · violet→pink gradient accent
   Glassmorphism, glow, 3D hover, animated hero orbs.
   ============================================================ */
:root {
  --bg: #05060c;
  --bg-2: #090a14;
  --surface: rgba(17, 19, 33, .72);
  --surface-solid: #111321;
  --surface-2: #181b2e;
  --line: #262b45;
  --line-soft: #1b1f36;
  --text: #eef0fa;
  --muted: #9aa1c0;
  --faint: #5c6284;
  --accent: #a78bfa;
  --accent-2: #ec4899;
  --acc-deep: #7c3aed;
  --cyan: #22d3ee;
  --btn-fg: #fff;
  --accent-grad: linear-gradient(120deg, #7c3aed, #a855f7 40%, #ec4899 85%);
  --accent-grad-anim: linear-gradient(120deg, #7c3aed, #a855f7 25%, #ec4899 50%, #22d3ee 75%, #7c3aed);
  --glow: 0 0 24px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 60px color-mix(in srgb, var(--accent-2) 12%, transparent);
  --teal: #34d3bd;
  --err: #f0564f;
  --r-lg: 22px;
  --r: 15px;
  --r-sm: 11px;
  --shadow-lg: 0 24px 70px rgba(0, 0, 0, .6);
  --shadow: 0 12px 40px rgba(0, 0, 0, .45);
  --font: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
/* ambient app background — soft aurora that lives behind everything */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(900px 520px at 85% -10%, color-mix(in srgb, var(--acc-deep) 16%, transparent), transparent 60%),
    radial-gradient(700px 460px at 8% 12%, color-mix(in srgb, var(--accent-2) 9%, transparent), transparent 60%),
    radial-gradient(800px 600px at 50% 115%, color-mix(in srgb, var(--cyan) 7%, transparent), transparent 60%),
    var(--bg);
}

::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
a { color: inherit; text-decoration: none; }
img, svg { max-width: 100%; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 0 28px; }

/* ============ motion primitives ============ */
@keyframes fadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
@keyframes gradShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(40px, -30px) scale(1.08); }
  66% { transform: translate(-30px, 24px) scale(.94); }
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 35%, transparent); }
  50% { box-shadow: 0 0 34px color-mix(in srgb, var(--accent-2) 50%, transparent); }
}
@keyframes spinSlow { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ============ header ============ */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(5, 6, 12, .68);
  backdrop-filter: blur(20px) saturate(150%);
  border-bottom: 1px solid color-mix(in srgb, var(--acc-deep) 18%, transparent);
}
.site-header .wrap { display: flex; align-items: center; gap: 30px; height: 72px; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 20px; cursor: pointer; }
.brand .mark {
  width: 40px; height: 40px; border-radius: 12px; flex: none;
  background: var(--accent-grad);
  display: grid; place-items: center; font-size: 19px;
  box-shadow: var(--glow);
  transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
}
.brand:hover .mark { transform: rotate(-8deg) scale(1.08); }
.brand em { font-style: normal; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.head-nav { display: flex; gap: 6px; flex: 1; }
.head-nav a {
  padding: 8px 16px; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--muted);
  transition: color .15s, background .15s;
}
.head-nav a:hover { color: var(--text); background: color-mix(in srgb, var(--acc-deep) 12%, transparent); }

/* ============ buttons ============ */
.btn {
  position: relative; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 12px 26px; border-radius: 13px; border: 1px solid transparent;
  font: inherit; font-size: 15.5px; font-weight: 800; cursor: pointer; line-height: 1.4;
  transition: transform .18s cubic-bezier(.34, 1.56, .64, 1), box-shadow .25s, background .15s, border-color .15s;
  white-space: nowrap;
}
.btn:active { transform: translateY(1.5px) scale(.99); }
.btn:disabled { opacity: .5; cursor: wait; }
.btn-primary {
  background: var(--accent-grad); background-size: 160% 160%; color: var(--btn-fg);
  box-shadow: 0 8px 28px color-mix(in srgb, var(--acc-deep) 38%, transparent);
  animation: gradShift 7s ease infinite;
}
/* shine sweep across primary buttons on hover */
.btn-primary::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .28) 50%, transparent 62%);
  transform: translateX(-120%);
  transition: transform .6s ease;
}
[dir="rtl"] .btn-primary::after { transform: translateX(120%); }
.btn-primary:hover:not(:disabled) { box-shadow: 0 14px 44px color-mix(in srgb, var(--accent) 55%, transparent); transform: translateY(-2px); }
.btn-primary:hover:not(:disabled)::after { transform: translateX(120%); }
[dir="rtl"] .btn-primary:hover:not(:disabled)::after { transform: translateX(-120%); }
.btn-ghost {
  border-color: var(--line); color: var(--text);
  background: rgba(255, 255, 255, .03); backdrop-filter: blur(8px);
}
.btn-ghost:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--acc-deep) 10%, transparent); box-shadow: 0 0 20px color-mix(in srgb, var(--acc-deep) 18%, transparent); transform: translateY(-1px); }
.btn-lg { padding: 16px 38px; font-size: 17px; border-radius: 15px; }
.btn-sm { padding: 8px 18px; font-size: 13.5px; font-weight: 700; }
.btn-xs { padding: 5px 13px; font-size: 12px; font-weight: 700; border-radius: 8px; }
.btn-block { width: 100%; margin-top: 20px; }
.btn-stop { background: var(--err); color: #fff; display: none; width: 100%; margin-top: 10px; }

/* ============ landing ============ */
.hero {
  position: relative; overflow: hidden; text-align: center;
  padding: 118px 0 96px;
}
/* animated 3D-ish gradient orbs */
.hero::before, .hero::after {
  content: ""; position: absolute; border-radius: 50%; pointer-events: none;
  filter: blur(90px); opacity: .5;
}
.hero::before {
  width: 560px; height: 560px; top: -180px; inset-inline-start: -120px;
  background: radial-gradient(circle at 35% 35%, var(--acc-deep), color-mix(in srgb, var(--acc-deep) 55%, #000) 60%, transparent 75%);
  animation: orbFloat 16s ease-in-out infinite;
}
.hero::after {
  width: 480px; height: 480px; bottom: -160px; inset-inline-end: -100px;
  background: radial-gradient(circle at 60% 40%, var(--accent-2), var(--cyan) 80%, transparent 90%);
  animation: orbFloat 20s ease-in-out infinite reverse;
}
.hero > .wrap { position: relative; z-index: 1; }
.kicker {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 18px; border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--acc-deep) 12%, transparent);
  backdrop-filter: blur(10px);
  color: var(--accent); font-size: 13.5px; font-weight: 700; margin-bottom: 26px;
  animation: fadeUp .7s ease both;
}
.hero h1 {
  font-size: clamp(40px, 6.4vw, 74px); font-weight: 900; line-height: 1.22;
  letter-spacing: -.5px; margin-bottom: 22px;
  animation: fadeUp .7s .08s ease both;
}
.hero h1 .grad {
  background: var(--accent-grad-anim); background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: gradShift 6s linear infinite;
}
.hero .sub { max-width: 640px; margin: 0 auto 40px; color: var(--muted); font-size: 19px; font-weight: 500; animation: fadeUp .7s .16s ease both; }
.hero-ctas { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; animation: fadeUp .7s .24s ease both; }
.hero-stats {
  display: flex; gap: 56px; justify-content: center; margin-top: 66px; flex-wrap: wrap;
  animation: fadeUp .7s .32s ease both;
}
.hero-stats b { display: block; font-size: 36px; font-weight: 900; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-stats span { color: var(--muted); font-size: 14px; font-weight: 600; }

.section { padding: 96px 0; position: relative; }
.section.alt { background: rgba(10, 11, 22, .55); border-block: 1px solid var(--line-soft); }
.sec-head { text-align: center; max-width: 620px; margin: 0 auto 56px; }
.sec-head h2 { font-size: clamp(28px, 4vw, 42px); font-weight: 900; margin-bottom: 12px; }
.sec-head p { color: var(--muted); font-size: 17px; }

/* feature cards — glass + 3D tilt */
.feat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; perspective: 1200px; }
.feat {
  background: var(--surface); backdrop-filter: blur(14px);
  border: 1px solid var(--line-soft); border-radius: var(--r-lg);
  padding: 30px 26px; position: relative; overflow: hidden;
  transform-style: preserve-3d;
  transition: transform .35s cubic-bezier(.22, 1, .36, 1), border-color .25s, box-shadow .3s;
}
.feat::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(420px 200px at 50% -20%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
  opacity: 0; transition: opacity .3s;
}
.feat:hover {
  transform: translateY(-8px) rotateX(4deg) rotateY(-3deg) scale(1.015);
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  box-shadow: 0 22px 60px rgba(0, 0, 0, .5), 0 0 42px color-mix(in srgb, var(--acc-deep) 16%, transparent);
}
[dir="rtl"] .feat:hover { transform: translateY(-8px) rotateX(4deg) rotateY(3deg) scale(1.015); }
.feat:hover::before { opacity: 1; }
.feat .num {
  position: absolute; top: 14px; inset-inline-end: 20px;
  font-size: 44px; font-weight: 900; color: color-mix(in srgb, var(--accent) 14%, transparent); line-height: 1;
}
.feat .ico {
  width: 54px; height: 54px; border-radius: 16px; margin-bottom: 20px;
  display: grid; place-items: center; font-size: 25px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--acc-deep) 28%, transparent), color-mix(in srgb, var(--accent-2) 14%, transparent));
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  box-shadow: inset 0 0 18px color-mix(in srgb, var(--accent) 12%, transparent);
  transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
}
.feat:hover .ico { transform: translateZ(26px) scale(1.1); }
.feat h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
.feat p { color: var(--muted); font-size: 14px; line-height: 1.75; }

.how-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; counter-reset: hstep; }
.how {
  background: var(--surface); backdrop-filter: blur(12px);
  border: 1px solid var(--line-soft); border-radius: var(--r);
  padding: 26px 22px; text-align: center;
  transition: transform .3s, border-color .25s, box-shadow .3s;
}
.how:hover { transform: translateY(-5px); border-color: color-mix(in srgb, var(--cyan) 40%, transparent); box-shadow: 0 14px 40px rgba(0, 0, 0, .4); }
.how::before {
  counter-increment: hstep; content: counter(hstep);
  display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 16px;
  border-radius: 50%; background: var(--accent-grad); color: var(--btn-fg);
  font-size: 20px; font-weight: 900;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--acc-deep) 40%, transparent);
}
.how p { font-size: 15px; font-weight: 700; }

/* pricing — hot plan gets an animated gradient border */
.price-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 420px)); gap: 22px; justify-content: center; }
.price {
  background: var(--surface); backdrop-filter: blur(14px);
  border: 1px solid var(--line-soft); border-radius: var(--r-lg);
  padding: 38px 34px; display: flex; flex-direction: column;
  transition: transform .3s, box-shadow .3s;
}
.price:hover { transform: translateY(-6px); box-shadow: var(--shadow); }
.price.hot {
  position: relative; border: 1px solid transparent;
  background:
    linear-gradient(var(--surface-solid), var(--surface-solid)) padding-box,
    var(--accent-grad-anim) border-box;
  background-size: auto, 300% 100%;
  animation: gradShift 6s linear infinite;
  box-shadow: 0 16px 56px color-mix(in srgb, var(--acc-deep) 22%, transparent);
}
.price .flag {
  position: absolute; top: -14px; inset-inline-start: 50%; transform: translateX(50%);
  background: var(--accent-grad); color: var(--btn-fg); font-size: 12px; font-weight: 900;
  padding: 5px 18px; border-radius: 999px;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent-2) 40%, transparent);
}
[dir="ltr"] .price .flag { transform: translateX(-50%); }
.price h3 { font-size: 19px; font-weight: 800; }
.price .amount { font-size: 52px; font-weight: 900; margin: 14px 0 4px; }
.price .amount small { font-size: 15px; color: var(--muted); font-weight: 600; }
.price ul { list-style: none; margin: 22px 0 30px; flex: 1; }
.price li { padding: 9px 0; font-size: 15px; color: #ccd1ea; display: flex; gap: 11px; font-weight: 600; }
.price li::before { content: "✓"; color: var(--cyan); font-weight: 900; }
.price-note { text-align: center; color: var(--faint); font-size: 13px; margin-top: 18px; }

.site-footer { border-top: 1px solid var(--line-soft); padding: 44px 0; text-align: center; color: var(--muted); font-size: 14px; }

/* ============ studio ============ */
body.in-studio #landing { display: none; }
#studio { display: none; }
body.in-studio #studio { display: block; }

.stepper-bar {
  border-bottom: 1px solid color-mix(in srgb, var(--acc-deep) 16%, transparent); background: rgba(8, 9, 18, .72);
  backdrop-filter: blur(16px);
  position: sticky; top: 72px; z-index: 90;
}
.stepper { display: flex; align-items: stretch; gap: 4px; overflow-x: auto; padding: 12px 0; }
.step-btn {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 20px; border-radius: 13px; cursor: pointer;
  border: 1px solid transparent; background: transparent; color: var(--muted);
  font: inherit; font-size: 15px; font-weight: 700; white-space: nowrap;
  transition: all .2s;
}
.step-btn:hover { color: var(--text); background: color-mix(in srgb, var(--acc-deep) 10%, transparent); }
.step-btn.on {
  background: color-mix(in srgb, var(--acc-deep) 14%, transparent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent);
  box-shadow: 0 0 22px color-mix(in srgb, var(--acc-deep) 16%, transparent);
}
.step-btn .n {
  display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface-2); border: 1.5px solid var(--line); color: var(--muted);
  font-size: 13.5px; font-weight: 800; transition: all .2s;
}
.step-btn.on .n { background: var(--accent-grad); border-color: transparent; color: var(--btn-fg); animation: pulseGlow 2.6s ease-in-out infinite; }
.step-btn.done .n { background: var(--teal); border-color: transparent; color: #06231f; animation: none; }
.step-btn.done .n::before { content: "✓"; }
.step-btn.done .n span { display: none; }
.step-sep { align-self: center; width: 26px; height: 2px; background: var(--line); border-radius: 2px; flex: none; }
.step-gear { margin-inline-start: auto; }

.panel { display: none; padding: 34px 0 90px; }
.panel.show { display: block; animation: fadeUp .4s ease both; }
.panel-grid { display: grid; grid-template-columns: 410px minmax(0, 1fr); gap: 24px; align-items: start; }
/* CRITICAL: children of the grid must never blow the layout open */
.panel-grid > * { min-width: 0; }

.card {
  background: var(--surface); backdrop-filter: blur(14px);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-lg); padding: 28px;
  box-shadow: var(--shadow);
}
.card h3 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
.card .hint { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; line-height: 1.8; }

label.f { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 7px; }
textarea, input[type="text"], input[type="password"], select {
  width: 100%; background: rgba(5, 6, 12, .7); color: var(--text);
  border: 1.5px solid var(--line); border-radius: var(--r-sm);
  padding: 12px 15px; font: inherit; font-size: 14.5px; font-weight: 500;
  outline: none; transition: border-color .2s, box-shadow .2s;
}
textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent), 0 0 24px color-mix(in srgb, var(--acc-deep) 12%, transparent); }
textarea { resize: vertical; min-height: 130px; }

/* two form fields side by side (script specs) */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
@media (max-width: 560px) { .two-col { grid-template-columns: 1fr; } }

/* checkbox row */
label.check {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  margin: 16px 0 4px; font-size: 14px; font-weight: 700; color: var(--text);
}
label.check input[type="checkbox"] {
  width: 19px; height: 19px; flex: none; accent-color: #a855f7; cursor: pointer;
}

.upload {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px dashed var(--line); border-radius: var(--r-sm);
  padding: 17px; color: var(--muted); font-size: 14px; font-weight: 700; cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
}
.upload:hover { border-color: var(--accent); color: var(--text); background: color-mix(in srgb, var(--acc-deep) 6%, transparent); }
.upload input { display: none; }
#pdf-name { color: var(--teal); font-size: 13px; font-weight: 700; margin-top: 8px; }

/* ============ output ============
   Long English prompts and tables must NEVER escape the panel:
   - everything wraps (pre-wrap + break-word)
   - the panel itself is the only scroll container            */
.out {
  background: var(--surface); backdrop-filter: blur(14px);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-lg); padding: 28px 30px;
  min-height: 380px; max-height: 74vh; overflow-y: auto; overflow-x: hidden;
  font-size: 15px; box-shadow: var(--shadow);
  min-width: 0; overflow-wrap: anywhere;
}
.out:empty::before { content: "الناتج هيظهر هنا…"; color: var(--faint); font-weight: 600; }
html[lang="en"] .out:empty::before { content: "Output will appear here…"; }
.md h2, .md h3, .md h4, .md h5 { margin: 22px 0 8px; color: var(--accent); font-weight: 800; }
.md h2 { font-size: 21px; } .md h3 { font-size: 17.5px; } .md h4 { font-size: 15.5px; }
.md p { margin: 7px 0; }
.md ul { margin: 8px 22px 8px 0; }
[dir="ltr"] .md ul { margin: 8px 0 8px 22px; }
.md li { margin: 4px 0; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.md code {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 1px 8px; font-size: 13px; font-family: var(--mono);
  direction: ltr; unicode-bidi: embed;
  overflow-wrap: anywhere;
}
.md pre {
  background: rgba(5, 6, 12, .82); border: 1px solid color-mix(in srgb, var(--acc-deep) 28%, transparent);
  border-radius: var(--r-sm);
  padding: 15px 17px; margin: 13px 0;
  font-size: 13px; line-height: 1.7; font-family: var(--mono);
  direction: ltr; text-align: left;
  white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  max-width: 100%;
}
.md table { border-collapse: collapse; margin: 0; width: 100%; font-size: 13.5px; }
.md td {
  border: 1px solid var(--line); padding: 8px 12px; vertical-align: top;
  max-width: 360px; overflow-wrap: anywhere; word-break: break-word;
}
.md tr:first-child td { background: var(--surface-2); font-weight: 800; }
.md .thinking, .out .thinking { color: var(--muted); font-weight: 600; }
.md .err, .out .err { color: var(--err); font-weight: 700; }

/* markdown tables scroll inside their own wrapper — never break layout */
.tblw { overflow-x: auto; max-width: 100%; margin: 14px 0; border-radius: var(--r-sm); border: 1px solid var(--line-soft); }

.actions { display: none; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

#carry-note {
  display: none; margin-top: 14px; padding: 12px 17px;
  background: rgba(52, 211, 189, .08); border: 1px solid rgba(52, 211, 189, .35);
  border-radius: var(--r-sm); color: var(--teal); font-size: 13.5px; font-weight: 700;
}

/* scene cards */
.scene-card {
  position: relative;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--surface-2); padding: 18px 20px 18px; margin-bottom: 18px;
  transition: transform .25s, border-color .25s, box-shadow .25s;
}
.scene-card::before {
  content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px;
  border-radius: 3px; background: var(--accent-grad);
}
.scene-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 40%, transparent); box-shadow: 0 14px 40px rgba(0, 0, 0, .4); }
.scene-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.scene-head b { color: var(--accent); font-size: 15px; font-weight: 800; }
.scene-prompt { margin-top: 12px; min-width: 0; }
.sp-head { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--cyan); font-weight: 800; margin-bottom: 6px; }
.scene-prompt pre {
  background: rgba(5, 6, 12, .82); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 12px 14px; margin: 0;
  font-size: 12.5px; line-height: 1.7;
  white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  direction: ltr; text-align: left; font-family: var(--mono);
  max-width: 100%;
}
.scene-prompt pre[dir="auto"] { direction: unset; text-align: start; }

/* ============ planning chat ============ */
.chat-shell { max-width: 880px; margin: 0 auto; }
.chat-card { display: flex; flex-direction: column; height: min(72vh, 760px); padding: 18px; }
.chat-log {
  flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
  gap: 14px; padding: 6px 4px 14px;
  min-width: 0;
}
.msg {
  max-width: 88%; padding: 13px 18px; border-radius: 16px;
  font-size: 14.5px; line-height: 1.85; overflow-wrap: anywhere;
  min-width: 0;
  animation: fadeUp .3s ease both;
}
.msg.user {
  align-self: flex-start;
  background: color-mix(in srgb, var(--acc-deep) 16%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  border-start-start-radius: 4px;
}
.msg.ai {
  align-self: flex-end;
  background: var(--surface-2); border: 1px solid var(--line);
  border-start-end-radius: 4px;
  max-width: 94%;
}
.msg .chip { display: inline-block; margin-top: 7px; }
.chip {
  background: color-mix(in srgb, var(--cyan) 10%, transparent); border: 1px solid color-mix(in srgb, var(--cyan) 35%, transparent);
  color: var(--cyan); border-radius: 8px; padding: 2px 10px;
  font-size: 12px; font-weight: 700;
}
.chip:empty { display: none; }
.chat-input {
  display: flex; gap: 10px; align-items: flex-end;
  border-top: 1px solid var(--line-soft); padding-top: 14px;
}
.chat-input textarea { flex: 1; min-height: 46px; max-height: 130px; resize: none; }
.attach {
  display: grid; place-items: center; width: 46px; height: 46px; flex: none;
  border: 1.5px dashed var(--line); border-radius: var(--r-sm);
  font-size: 18px; cursor: pointer; transition: border-color .15s, box-shadow .2s;
}
.attach:hover { border-color: var(--accent); box-shadow: 0 0 16px color-mix(in srgb, var(--acc-deep) 20%, transparent); }
.attach input { display: none; }
.chat-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 10px; flex-wrap: wrap; }

/* voice-over */
.voice-result { display: none; margin-top: 18px; }
.voice-result audio { width: 100%; margin-bottom: 12px; }
.voice-status { color: var(--muted); font-size: 14px; font-weight: 700; margin-top: 14px; }
.voice-status.err { color: var(--err); }

/* settings */
.settings-card { max-width: 620px; margin: 0 auto; }
.mode-switch { display: flex; gap: 12px; margin-bottom: 22px; }
.mode-btn {
  flex: 1; padding: 16px 12px; border-radius: var(--r); cursor: pointer;
  border: 1.5px solid var(--line); background: rgba(5, 6, 12, .6); color: var(--muted);
  font: inherit; font-size: 15px; font-weight: 800; text-align: center;
  transition: border-color .2s, color .2s, background .2s, box-shadow .2s;
}
.mode-btn small { display: block; font-weight: 500; font-size: 12px; margin-top: 4px; color: var(--faint); }
.mode-btn:hover { color: var(--text); }
.mode-btn.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--acc-deep) 10%, transparent); box-shadow: 0 0 22px color-mix(in srgb, var(--acc-deep) 14%, transparent); }
.mode-btn.on small { color: var(--muted); }
.note {
  margin-top: 16px; padding: 13px 17px; border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--acc-deep) 8%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  color: var(--muted); font-size: 13.5px; line-height: 1.8;
}
.note b { color: var(--accent); }

/* toast */
.toast {
  position: fixed; bottom: 28px; right: 50%; transform: translate(50%, 16px);
  background: rgba(24, 27, 46, .88); backdrop-filter: blur(14px);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  color: var(--text); padding: 13px 26px; border-radius: 13px;
  font-size: 14.5px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s cubic-bezier(.34, 1.56, .64, 1);
  z-index: 300; box-shadow: var(--shadow-lg), 0 0 30px color-mix(in srgb, var(--acc-deep) 18%, transparent);
}
.toast.show { opacity: 1; transform: translate(50%, 0); }

/* responsive */
@media (max-width: 1020px) {
  .feat-grid, .how-grid { grid-template-columns: 1fr 1fr; }
  .panel-grid { grid-template-columns: 1fr; }
  .head-nav { display: none; }
}
@media (max-width: 620px) {
  .feat-grid, .how-grid, .price-grid { grid-template-columns: 1fr; }
  .hero { padding: 70px 0 60px; }
  .hero-stats { gap: 30px; }
  .mode-switch { flex-direction: column; }
}


/* ============ THEMES — picked from the header dots, saved locally ============ */
html[data-theme="ocean"] {
  --accent: #4cc4ff; --accent-2: #6366f1; --acc-deep: #0284d8; --cyan: #22d3ee; --btn-fg: #fff;
  --accent-grad: linear-gradient(120deg, #0891d1, #38bdf8 45%, #6366f1);
  --accent-grad-anim: linear-gradient(120deg, #0891d1, #38bdf8 25%, #6366f1 50%, #22d3ee 75%, #0891d1);
  --bg: #04070d; --bg-2: #070b14;
  --surface: rgba(13, 19, 32, .72); --surface-solid: #0d1320; --surface-2: #131b2c;
  --line: #1f2b45; --line-soft: #17203355;
}
html[data-theme="emerald"] {
  --accent: #3ee6a8; --accent-2: #22d3ee; --acc-deep: #0a9e6d; --cyan: #67e8f9; --btn-fg: #04231a;
  --accent-grad: linear-gradient(120deg, #0d9f70, #10c98a 45%, #22d3ee);
  --accent-grad-anim: linear-gradient(120deg, #0d9f70, #10c98a 25%, #22d3ee 50%, #34d399 75%, #0d9f70);
  --bg: #040b09; --bg-2: #071310;
  --surface: rgba(10, 24, 20, .72); --surface-solid: #0a1814; --surface-2: #10231d;
  --line: #1b3a31; --line-soft: #142b2455;
}
html[data-theme="gold"] {
  --accent: #f2b23e; --accent-2: #e8862d; --acc-deep: #d98a1f; --cyan: #43cabb; --btn-fg: #201302;
  --accent-grad: linear-gradient(120deg, #f6c15a, #f2b23e 45%, #e8862d);
  --accent-grad-anim: linear-gradient(120deg, #f6c15a, #f2b23e 25%, #e8862d 50%, #f6c15a 75%, #f6c15a);
  --bg: #0a0c11; --bg-2: #0d1017;
  --surface: rgba(19, 23, 34, .78); --surface-solid: #131722; --surface-2: #1a1f2d;
  --line: #242b3d; --line-soft: #1c2231;
}
/* light mode — sky blue on white */
html[data-theme="sky"] {
  --accent: #0ea5e9; --accent-2: #2563eb; --acc-deep: #0284c7; --cyan: #06b6d4; --btn-fg: #fff;
  --accent-grad: linear-gradient(120deg, #0284c7, #38bdf8 45%, #2563eb);
  --accent-grad-anim: linear-gradient(120deg, #0284c7, #38bdf8 25%, #2563eb 50%, #06b6d4 75%, #0284c7);
  --bg: #eef6fd; --bg-2: #ffffff;
  --surface: rgba(255, 255, 255, .85); --surface-solid: #ffffff; --surface-2: #e8f2fb;
  --line: #c9ddef; --line-soft: #dcebf7;
  --text: #0c1b2a; --muted: #46617d; --faint: #7e95ad;
  --shadow-lg: 0 24px 70px rgba(30, 80, 140, .16);
  --shadow: 0 12px 40px rgba(30, 80, 140, .12);
}
html[data-theme="sky"] .deepthink { background: rgba(2, 132, 199, .06); }
html[data-theme="sky"] .tdot { border-color: rgba(12, 27, 42, .18); }
html[data-theme="sky"] .tdot.on { border-color: var(--accent); }

/* theme picker dots (header) */
.theme-dots { display: flex; gap: 7px; align-items: center; }
.tdot {
  width: 20px; height: 20px; border-radius: 50%; cursor: pointer; flex: none;
  border: 2px solid rgba(255, 255, 255, .18); padding: 0;
  transition: transform .2s cubic-bezier(.34, 1.56, .64, 1), border-color .2s, box-shadow .2s;
}
.tdot:hover { transform: scale(1.22); }
.tdot.on { border-color: #fff; box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent); transform: scale(1.12); }
.tdot[data-theme="ocean"] { background: linear-gradient(120deg, #0891d1, #38bdf8, #6366f1); }
.tdot[data-theme="violet"] { background: linear-gradient(120deg, #7c3aed, #a855f7, #ec4899); }
.tdot[data-theme="emerald"] { background: linear-gradient(120deg, #0d9f70, #10c98a, #22d3ee); }
.tdot[data-theme="gold"] { background: linear-gradient(120deg, #f6c15a, #f2b23e, #e8862d); }
.tdot[data-theme="sky"] { background: linear-gradient(120deg, #e0f2fe, #7dd3fc, #2563eb); }

/* dark / light toggle (header) */
.mode-toggle {
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer; flex: none;
  border: 1.5px solid var(--line); background: transparent; font-size: 14px; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; padding: 0;
  transition: transform .2s cubic-bezier(.34, 1.56, .64, 1), border-color .2s;
}
.mode-toggle:hover { transform: scale(1.15); border-color: var(--accent); }

/* shoot list — scenes × seconds control (script tab) */
.shoot-list {
  border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 12px 14px; margin: 0 0 10px;
  background: color-mix(in srgb, var(--surface-2) 60%, transparent);
}
.sl-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
.sl-title { font-size: 12.5px; font-weight: 800; letter-spacing: .06em; color: var(--accent); }
.sl-total { font-size: 12px; color: var(--muted); font-weight: 700; }
.sl-row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
.sl-group label { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.stepper-ctl { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.stepper-ctl button {
  width: 28px; height: 28px; border: none; border-radius: 8px; cursor: pointer;
  background: var(--surface-2); color: var(--text); font-size: 16px; font-weight: 800;
  transition: background .18s;
}
.stepper-ctl button:hover { background: color-mix(in srgb, var(--accent) 22%, var(--surface-2)); }
.stepper-ctl span { min-width: 30px; text-align: center; font-weight: 800; font-size: 15px; }
.stepper-ctl small { color: var(--faint); margin-inline-end: 5px; font-weight: 700; }
.sl-chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.sl-chips button {
  padding: 6px 13px; border-radius: 9px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 800;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  transition: all .18s; direction: ltr;
}
.sl-chips button:hover { border-color: var(--accent); color: var(--text); }
.sl-chips button.on { background: var(--accent); border-color: var(--accent); color: var(--btn-fg); }

/* ============ prompt library ============ */
.lib-cats { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 18px; }
.lib-cat {
  padding: 7px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 800;
  border: 1px solid var(--line); background: transparent; color: var(--muted); transition: all .18s;
}
.lib-cat:hover { border-color: var(--accent); color: var(--text); }
.lib-cat.on { background: var(--accent); border-color: var(--accent); color: var(--btn-fg); }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.lib-card {
  border: 1px solid var(--line); border-radius: var(--r); padding: 16px;
  background: color-mix(in srgb, var(--surface-2) 55%, transparent);
  display: flex; flex-direction: column; gap: 8px;
  transition: transform .2s, border-color .2s, box-shadow .2s;
}
.lib-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: var(--shadow); }
.lib-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lib-card h4 { font-size: 16px; }
.lib-type { font-size: 11.5px; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
.lt-idea  { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.lt-image { background: color-mix(in srgb, var(--teal) 18%, transparent); color: var(--teal); }
.lt-video { background: color-mix(in srgb, var(--accent-2) 18%, transparent); color: var(--accent-2); }
.lib-niche { font-size: 12px; color: var(--faint); font-weight: 700; }
.lib-desc { font-size: 13px; color: var(--muted); line-height: 1.6; }
.lib-preview {
  font-size: 12px; line-height: 1.7; color: var(--muted);
  background: color-mix(in srgb, var(--bg-2) 70%, transparent);
  border: 1px solid var(--line-soft); border-radius: var(--r-sm);
  padding: 10px 12px; margin: 0; white-space: pre-wrap; word-break: break-word;
  max-height: 128px; overflow: hidden; position: relative;
  -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent);
}
.lib-actions { display: flex; gap: 8px; margin-top: auto; }
.lib-preview { cursor: pointer; }
.lib-preview.open { max-height: none; -webkit-mask-image: none; mask-image: none; }
.lib-head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.lib-count {
  font-size: 12.5px; font-weight: 800; color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  padding: 4px 12px; border-radius: 999px;
}
.lib-cat.lib-pack { border-style: dashed; color: var(--accent); }
#lib-types { margin-top: -8px; }

/* raw provider error under a failed sketch — small, technical, LTR */
.sketch-detail {
  font-family: var(--mono); font-size: 10.5px; line-height: 1.5; color: var(--faint);
  margin-top: 6px; text-align: left; word-break: break-word;
}

/* character reference (storyboard) */
.char-ref { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.char-ref .upload { flex: 1; padding: 12px; margin: 0; }
.char-thumb {
  width: 52px; height: 52px; border-radius: var(--r-sm); object-fit: cover; display: none;
  border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
  box-shadow: 0 0 14px color-mix(in srgb, var(--acc-deep) 30%, transparent);
}

/* studio chat layout: chat and output share the panel half/half */
.chat-grid { grid-template-columns: minmax(0, 46fr) minmax(0, 54fr); }
@media (max-width: 1020px) { .chat-grid { grid-template-columns: 1fr; } }

/* DeepThink toggle */
.deepthink {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 16px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--line); background: rgba(255, 255, 255, .03);
  color: var(--muted); font: inherit; font-size: 13px; font-weight: 800;
  transition: all .25s cubic-bezier(.34, 1.56, .64, 1);
}
.deepthink:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--text); transform: translateY(-1px); }
.deepthink.on {
  background: var(--accent-grad); background-size: 160% 160%; color: var(--btn-fg);
  border-color: transparent;
  animation: gradShift 7s ease infinite, pulseGlow 2.6s ease-in-out infinite;
}

/* generated b/w sketch inside scene cards */
.sketch-box { margin-top: 12px; }
.sketch-box img {
  width: 100%; border-radius: var(--r-sm); display: block;
  border: 1px solid var(--line);
  background: #fff;
}
.sketch-status { color: var(--muted); font-size: 12.5px; font-weight: 700; }

</style>

let LANG = localStorage.getItem("fta_lang") || "ar";

function t(key) { return (I18N[LANG] && I18N[LANG][key]) ?? I18N.ar[key] ?? key; }

function applyLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
  const btn = document.getElementById("lang-btn");
  if (btn) btn.textContent = LANG === "ar" ? "EN" : "عربي";
}

function toggleLang() {
  LANG = LANG === "ar" ? "en" : "ar";
  localStorage.setItem("fta_lang", LANG);
  applyLang();
}

ive per campaign, indicative budget split (if budget unknown, give % split).\n10. **Measurement Dashboard** — KPIs per objective, review cadence (weekly/monthly), and the decision rule for killing or scaling content.\n\nRules: numbers over adjectives; every idea must map to a pillar and an objective; calendar hooks must be specific (\"3 mistakes that burn your ad budget — #2 is everywhere\") never generic (\"engaging post about product\").\n\n---\n\n## MODE 2 — SCRIPT (idea/text → structured screenplay)\n\nTrigger: user gives an idea, message, product, or story and wants a script — film, series episode, short story, documentary, TV ad, or UGC/social video.\n\nThe request may carry spec fields: FORMAT, TARGET DURATION, GENRE, TONE, DIALECT (e.g. Egyptian Arabic / Gulf / MSA / English), TARGET AUDIENCE, PLATFORM, CHARACTERS/SETTING, CTA, and a BRIEF (an uploaded client document — as text and/or scanned page images). Honor every provided field strictly — dialogue must be written in the requested DIALECT; if a BRIEF exists, the script must be grounded in its ACTUAL content (real brand, real product, real audience, real objectives) — never invent facts not present in it. Infer anything not provided.\n\nFirst line of output: `FORMAT: <…> · LENGTH: <…> · GENRE: <…> · TONE: <…> · DIALECT: <…>`\n(State them so the user can correct.)\n\nThen produce:\n\n1. **Logline** — one sentence: protagonist + goal + obstacle + stakes.\n2. **Synopsis** — one paragraph (3–6 sentences).\n3. **Director's Vision** — one short paragraph: the visual treatment and why it sells the idea (look & mood, pacing, one or two film/ad references, the emotional arc from first frame to last).\n4. **Characters** — for each: name, age, role, want vs. need, voice notes, and a **Visual Identity Line** (face, build, hair, wardrobe, distinguishing detail — this line is reused verbatim in storyboard prompts for consistency).\n5. **Structure** — beats appropriate to the format:\n   - Film/short: 3-act beats (setup .g. 35mm anamorphic, shallow DOF, handheld energy>\nAspect ratio: <9:16 / 16:9 / 1:1 per platform>\nCharacter sheets: <each character's Visual Identity Line from the script>\n```\n\nThen, for **every scene** in order, output exactly this structure — a header + short description in the user's language, followed by ONE fenced markdown code block that packs everything copy-ready:\n\n━━━ SCENE 04 — <slugline> ━━━\n📋 Board description: what the frame shows, staging, blocking (user's language)\n🎬 Shot: <size> · <angle> · <movement> · <lighting> · <time of day> · ⏱ <seconds>\n\nThen the scene's single fenced code block (```markdown … ```) containing, in this order:\n\n**SKETCH PROMPT:**\n<one short paragraph, English — the same frame as a black-and-white storyboard sketch: \"b/w storyboard sketch, pencil and ink, rough expressive linework\" + subject + action + composition. This is generated FIRST to approve framing before the full render.>\n\n**IMAGE PROMPT:**\n<one paragraph, English, comma-separated: subject with full Visual Identity Line, action frozen at the key moment, environment, lighting, lens (mm, DOF), composition, color grade, style keywords, quality tags, aspect ratio. No camera movement verbs — this is a still frame.>\n\n**MOTION PROMPT:**\n<one paragraph, English, for image-to-video (Runway / Kling / Veo / Luma): starts from the frame above. Camera: ONE clear movement. Subject: ONE clear action with natural physics. Environment motion (smoke, rain, hair, fabric). Pace, mood, duration hint. NEVER introduce subjects or locations not in the frame.>\n\n**VOICE-OVER:**\n<only when the request contains INCLUDE VOICE-OVER: yes — the exact words spoken during this scene (dialogue/narration) in the script's dialect, clean of any labels. Omit this field entirely when not requested.>\n\n**CHARACTER REF:**\n<only when the request contains a CHARACTER REFERENCE section — for every scene where that character appears, add this single English line: \"Attach the reference ph /* ---------- render ---------- */
let libCat = "";
let libType = "";

const LIB_TYPE_META = {
  idea:  { key: "lib_t_idea",  cls: "lt-idea"  },
  image: { key: "lib_t_image", cls: "lt-image" },
  video: { key: "lib_t_video", cls: "lt-video" },
};

function renderLibrary() {
  const grid = document.getElementById("lib-grid");
  if (!grid) return;

  const cats = document.getElementById("lib-cats");
  cats.innerHTML =
    `<button class="lib-cat ${libCat === "" ? "on" : ""}" onclick="libSetCat('')">${t("lib_all")}</button>` +
    PROMPT_LIB.map((c, ci) =>
      `<button class="lib-cat ${libCat === c.cat ? "on" : ""}" onclick="libSetCat('${c.cat.replace(/'/g, "\\'")}')">${c.cat}</button>`
    ).join("") +
    (libCat ? `<button class="lib-cat lib-pack" onclick="libCopyPack()">${t("lib_pack")}</button>` : "");

  const types = document.getElementById("lib-types");
  if (types) types.innerHTML =
    `<button class="lib-cat ${libType === "" ? "on" : ""}" onclick="libSetType('')">${t("lib_all")}</button>` +
    Object.entries(LIB_TYPE_META).map(([ty, m]) =>
      `<button class="lib-cat ${libType === ty ? "on" : ""}" onclick="libSetType('${ty}')">${t(m.key)}</button>`
    ).join("");

  const q = (document.getElementById("lib-search").value || "").trim().toLowerCase();
  const cards = [];
  PROMPT_LIB.forEach((c, ci) => {
    if (libCat && c.cat !== libCat) return;
    c.items.forEach((it, ii) => {
      if (libType && it.type !== libType) return;
      if (q && !(it.t + " " + it.d + " " + it.p + " " + c.cat).toLowerCase().includes(q)) return;
      const meta = LIB_TYPE_META[it.type];
      const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      cards.push(`
        <div class="lib-card">
          <div class="lib-card-head">
            <span class="lib-type ${meta.cls}">${t(meta.key)}</span>
            <span class="lib-niche">${c.cat}</span>
          </div>
          <h4>${esc(it.t)}</h4>
          <p class="lib-desc">${esc(it.d)}</p>
          <pre class="lib-preview" dir="${it.type === "idea" ? "rtl" : "ltr"}" title="${t("lib_expand")}"
               onclick="this.classList.toggle('open')">${esc(it.p)}</pre>
          <div class="lib-actions">
            <button class="btn btn-primary btn-xs" onclick="libCopy(${ci},${ii})">${t("lib_copy")}</button>
            ${it.type === "idea" ? `<button class="btn btn-ghost btn-xs" onclick="libUse(${ci},${ii})">${t("lib_use")}</button>` : ""}
          </div>
        </div>`);
    });
  });

  const count = document.getElementById("lib-count");
  if (count) count.textContent = t("lib_count").replace("{n}", cards.length);

  grid.innerHTML = cards.length ? cards.join("") : `<p class="hint">${t("lib_empty")}</p>`;
}

function libSetCat(cat) {
  libCat = cat;
  renderLibrary();
}

function libSetType(ty) {
  libType = ty;
  renderLibrary();
}

/* copy the selected niche's full pack (all its prompts, labelled) */
function libCopyPack() {
  const c = PROMPT_LIB.find(x => x.cat === libCat);
  if (!c) return;
  const pack = c.cat + "\n" + "=".repeat(30) + "\n\n" +
    c.items.map(it => `【${t(LIB_TYPE_META[it.type].key)} — ${it.t}】\n${it.p}`).join("\n\n---\n\n");
  navigator.clipboard.writeText(pack).then(() => toast(t("t_copied")));
}

function libCopy(ci, ii) {
  const it = PROMPT_LIB[ci].items[ii];

/* ===== js/docs.js ===== */
/* ============================================================
   FILM-TREND AI — universal document reader (client-side)
   Extracts text from PDF / DOCX / PPTX / TXT locally in the
   browser, so documents work with EVERY provider. Images are
   passed through as vision blocks.
   Libraries load lazily from CDN only when first needed.
   ============================================================ */

const _libCache = {};
function loadLib(url) {
  if (_libCache[url]) return _libCache[url];
  _libCache[url] = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = url;
    s.onload = resolve;
    s.onerror = () => reject(new Error("فشل تحميل مكتبة القراءة — اتأكد من الإنترنت"));
    document.head.appendChild(s);
  });
  return _libCache[url];
}

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const MAMMOTH = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js";
const JSZIP = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";

/**
 * extractDocument(file) →
 *   { text, images }   text = extracted document text (may be "")
 *                      images = [{mime,b64}] vision blocks (photo files,
 *                      or rendered PDF pages when the PDF is scanned /
 *                      image-heavy so the model can READ them itself)
 */
async function extractDocument(file) {
  const name = file.name.toLowerCase();
  const MAX = 25 * 1024 * 1024;
  if (file.size > MAX) throw new Error("الملف أكبر من 25MB");

  if (file.type.startsWith("image/")) {
    return { text: "", images: [{ mime: file.type, b64: await fileToBase64(file) }] };
  }
  if (name.endsWith(".txt") || name.endsWith(".md")) {
    return { text: await file.text(), images: [] };
  }
  if (name.endsWith(".pdf")) return await extractPdf(file);
  if (name.endsWith(".docx")) return { text: await extractDocx(file), images: [] };
  if (name.endsWith(".pptx")) return { text: await extractPptx(file), images: [] };
  throw new Error("صيغة غير مدعومة — المدعوم: PDF, Word, PowerPoint, صور, نص");
}

async function extractPdf(file) {
  await loadLib(PDFJS);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let out = [];
  const pages = Math.min(pdf.numPages, 80);
  for (let i = 1; i <= pages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    out.push(tc.items.map(it => it.str).join(" "));
  }
  const text = out.join("\n\n").trim();

  // Scanned or design-heavy PDF (little selectable text) → render the
  // pages themselves as images so vision models read + analyze them.
  const images = [];
  if (text.length < 1200) {
    const n = Math.min(pdf.numPages, 12);
    for (let i = 1; i <= n; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement("canvas");
      canvas.width = vp.width;
      canvas.height = vp.height;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
      images.push({ mime: "image/jpeg", b64: canvas.toDataURL("image/jpeg", 0.82).split(",")[1] });
    }
  }
  if (!text && !images.length) throw new Error("معرفتش أقرا حاجة من الـ PDF ده");
  return { text, images };
}

async function extractDocx(file) {
  await loadLib(MAMMOTH);
  const result = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
  const text = (result.value || "").trim();
  if (!text) throw new Error("معرفتش أقرا نص من ملف الـ Word ده");
  return text;
}

async function extractPptx(file) {
  await loadLib(JSZIP);
  const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
  const slideNames = Object.keys(zip.files)
    .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a, b) => parseInt(a.match(/\d+/)) - parseInt(b.match(/\d+/)));
  const slides = [];
  for (const n of slideNames) {
    const xml = await zip.files[n].async("string");
    const runs = [...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m => m[1]);
    if (runs.length) slides.push(`— شريحة ${slides.length + 1} —\n` + runs.join(" "));
  }
  const text = slides.join("\n\n").trim();
  if (!text) throw new Error("معرفتش أقرا نص من ملف الـ PowerPoint ده");
  return text;
}

/* ===== js/imagen.js ===== */
/* ============================================================
   FILM-TREND AI — storyboard sketch generator
   Draws black-and-white storyboard sketches with Google's free
   image model (gemini-2.5-flash-image). Uses the same free
   Gemini key as the voice-over. When a character reference
   photo is provided it is passed along so the drawn character
   keeps the same face/build in every frame.
   ============================================================ */

/* tried in order — first available image model on the key wins */
const SKETCH_MODELS = [
  "gemini-2.5-flash-image",
  "gemini-2.5-flash-image-preview",
  "gemini-2.0-flash-preview-image-generation",
];
let _sketchModel = null; // remembered after the first success

const SKETCH_STYLE_PREFIX =
  "Professional hand-drawn storyboard sketch, graphite pencil and fine ink pen on white paper, " +
  "loose confident expressive strokes, cross-hatching and soft pencil shading, " +
  "monochrome black and white, authentic sketchbook look with visible stroke texture, " +
  "clear cinematic composition and framing, no color. ";

/**
 * sketchGenerate(sceneDescription, refImage?) → Promise<dataURL>
 * refImage: {mime, b64} — optional character reference photo.
 */
async function sketchGenerate(sceneDescription, refImage) {
  const key = localStorage.getItem("fta_key_gemini") || "";
  if (!key) throw new Error("NO_KEY");

  const parts = [];
  if (refImage) {
    parts.push({ inline_data: { mime_type: refImage.mime, data: refImage.b64 } });
    parts.push({
      text: SKETCH_STYLE_PREFIX +
        "Draw this scene as a storyboard panel. The main character MUST look like the person " +
        "in the attached reference photo (same face, hair, build) rendered as a b/w sketch:\n" +
        sceneDescription,
    });
  } else {
    parts.push({ text: SKETCH_STYLE_PREFIX + "Draw this scene as a storyboard panel:\n" + sceneDescription });
  }

  // walk the model list: skip names this key doesn't have (404 / not-found)
  const models = _sketchModel ? [_sketchModel] : SKETCH_MODELS;
  let lastErr = "NO_IMAGE";
  for (const model of models) {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
      {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts }],
          // image models want TEXT+IMAGE — IMAGE alone is rejected by some
          generationConfig: { responseModalities: ["TEXT", "IMAGE"] },
        }),
      }
    );

    if (!res.ok) {
      let msg = "HTTP " + res.status;
      try { msg = (await res.json())?.error?.message || msg; } catch (_) {}
      // keep the raw Google message on the error so the UI can surface the real cause
      const fail = code => { const e = new Error(code); e.detail = msg; return e; };
      if (res.status === 404 || /not found|is not supported/i.test(msg)) { lastErr = "NO_MODEL"; continue; }
      if (res.status === 401 || res.status === 403) throw fail("BAD_KEY");
      if (res.status === 429) throw fail("RATE");
      if (/overload|unavailable|high demand/i.test(msg) || res.status >= 500) throw fail("BUSY");
      if (res.status === 400 && /modalit/i.test(msg)) { lastErr = msg; continue; }
      throw fail(msg);
    }

    const data = await res.json();
    const blocks = data?.candidates?.[0]?.content?.parts || [];
    const img = blocks.find(p => p.inlineData || p.inline_data);
    if (!img) { lastErr = "NO_IMAGE"; continue; }
    _sketchModel = model;
    const d = img.inlineData || img.inline_data;
    return `data:${d.mimeType || d.mime_type || "image/png"};base64,${d.data}`;
  }
  throw new Error(lastErr);
}

async function ttsGenerate(text, voiceName, stylePrefix, accentKey) {
  const accent = TTS_ACCENTS[accentKey || "none"] || "";
  stylePrefix = accent + (stylePrefix || "");
  const key = localStorage.getItem("fta_key_gemini") || "";
  if (!key) throw new Error("NO_KEY");

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent?key=${encodeURIComponent(key)}`,
    {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: (stylePrefix || "") + text }] }],
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } },
        },
      }),
    }
  );

  if (!res.ok) {
    let msg = "HTTP " + res.status;
    try { msg = (await res.json())?.error?.message || msg; } catch (_) { /* ignore */ }
    if (res.status === 400 || res.status === 403) throw new Error("BAD_KEY:" + msg);
    if (res.status === 429) throw new Error("RATE:" + msg);
    throw new Error(msg);
  }

  const data = await res.json();
  const part = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
  if (!part) throw new Error("no audio in response");

  // Gemini TTS returns raw 16-bit PCM; sample rate is in the mimeType (rate=24000)
  const rate = parseInt((part.inlineData.mimeType.match(/rate=(\d+)/) || [, "24000"])[1], 10);
  const pcm = Uint8Array.from(atob(part.inlineData.data), c => c.charCodeAt(0));
  return pcmToWav(pcm, rate);
}

/* wrap raw 16-bit mono PCM in a WAV container so <audio> can play it */
function pcmToWav(pcm, sampleRate) {
  const header = new ArrayBuffer(44);
  const v = new DataView(header);
  const str = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
  str(0, "RIFF");
  v.setUint32(4, 36 + pcm.length, true);
  str(8, "WAVE");
  str(12, "fmt ");
  v.setUint32(16, 16, true);        // fmt chunk size
  v.setUint16(20, 1, true);         // PCM
  v.setUint16(22, 1, true);         // mono
  v.setUint32(24, sampleRate, true);
  v.setUint32(28, sampleRate * 2, true); // byte rate
  v.setUint16(32, 2, true);         // block align
  v.setUint16(34, 16, true);        // bits per sample
  str(36, "data");
  v.setUint32(40, pcm.length, true);
  return new Blob([header, pcm], { type: "audio/wav" });
}

/* ---------- settings ---------- */
function backendUrl() {
  // localStorage override lets the owner test a Worker before baking it in
  return (localStorage.getItem("fta_backend") || FT_BACKEND_URL || "").replace(/\/+$/, "");
}

function getSettings() {
  const mode = localStorage.getItem("fta_mode") === "cloud" && backendUrl() ? "cloud" : "byok";
  const provider = localStorage.getItem("fta_provider") || "anthropic";
  const p = PROVIDERS[provider] ? provider : "anthropic";
  const custom = (localStorage.getItem("fta_custom_model_" + p) || "").trim();
  return {
    mode,
    cloudToken: localStorage.getItem("fta_cloud_token") || "",
    provider: p,
    apiKey: localStorage.getItem("fta_key_" + p) || "",
    model: custom || localStorage.getItem("fta_model_" + p) || PROVIDERS[p].models[0],
  };
}

function saveSettings(provider, apiKey, model, customModel) {
  localStorage.setItem("fta_provider", provider);
  localStorage.setItem("fta_key_" + provider, apiKey.trim());
  localStorage.setItem("fta_model_" + provider, model);
  localStorage.setItem("fta_custom_model_" + provider, (customModel || "").trim());
}

/* ============================================================
   streaming client — returns AbortController
   content: array of blocks [{type:"text",text}] and optionally
   one {type:"document", source:{...}} (Claude only)
   ============================================================ */
/**
 * runLLM(messages, handlers, opts)
 * messages: neutral history — [{role:"user"|"assistant", text, images?:[{mime,b64}]}]
 * opts.system: override the system prompt (defaults to SYSTEM_PROMPT)
 */
function runLLM(messages, handlers, opts = {}) {
  const { mode, cloudToken, provider, apiKey, model } = getSettings();
  const P = mode === "cloud" ? { protocol: "cloud", label: "☁️ حساب Film-trend" } : PROVIDERS[provider];
  const controller = new AbortController();
  const system = opts.system || SYSTEM_PROMPT;
  const hasImages = messages.some(m => m.images && m.images.length);

  let url, headers, body;

  if (P.protocol === "cloud") {
    if (hasImages) {
      handlers.onError("رفع الصور متاح في وضع المفتاح الخاص — في حساب Film-trend ارفع مستندات نصية (PDF/Word/PPTX)");
      return controller;
    }
    url = backendUrl() + "/generate";
    headers = { "content-type": "application/json", "authorization": "Bearer " + cloudToken };
    // the worker takes a single user string — flatten the conversation
    const flat = messages.map(m =>
      (m.role === "assistant" ? "ASSISTANT:\n" : "USER:\n") + m.text).join("\n\n");
    body = { system, user: flat };
  } else if (P.protocol === "anthropic") {
    url = P.url;
    headers = {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    };
    body = {
      model,
      max_tokens: 64000,
      stream: true,
      system,
      messages: messages.map(m => ({
        role: m.role,
        content: [
          ...(m.images || []).map(im => ({
            type: "image",
            source: { type: "base64", media_type: im.mime, data: im.b64 },
          })),
          { type: "text", text: m.text },
        ],
      })),
    };
    if (!model.startsWith("claude-haiku")) body.thinking = { type: "adaptive" };
  } else {
    url = P.url;
    headers = { "content-type": "application/json", "authorization": "Bearer " + apiKey };
    if (provider === "openrouter") {
      headers["HTTP-Referer"] = "https://film-trend.ai";
      headers["X-Title"] = "Film-trend AI";
    }
    body = {
      model,
      stream: true,
      messages: [
        { role: "system", content: system },
        ...messages.map(m => ({
          role: m.role,
          content: (m.images && m.images.length)
            ? [
                ...m.images.map(im => ({ type: "image_url", image_url: { url: `data:${im.mime};base64,${im.b64}` } })),
                { type: "text", text: m.text },
              ]
            : m.text,
        })),
      ],
    };
  }

  // strings fall back to Arabic when i18n isn't loaded (defensive)
  const T = k => (typeof t === "function" ? t(k) : ({
    err_overload: "⏳ الموديل عليه ضغط عالي دلوقتي — استنى دقيقة وجرّب تاني، أو بدّل لموديل أخف من الإعدادات.",
    err_rate: "تجاوزت حد الطلبات أو الرصيد خلص — استنى دقيقة أو راجع حسابك عند المزود",
    err_quota_day: "الحد اليومي المجاني خلص — بدّل الموديل من الإعدادات أو ارجع بكرة",
    err_server: "خطأ من الخادم — جرّب تاني",
    err_refusal: "الطلب اترفض لأسباب تتعلق بسياسة الاستخدام — جرّب تعيد صياغته",
    err_conn: "تعذّر الاتصال — اتأكد من الإنترنت والمفتاح",
  })[k] || k);

  // provider error bodies vary wildly: {error:{message}}, [{error:{…}}], {message}…
  const extractErrMsg = raw => {
    const e = Array.isArray(raw) ? raw[0] : raw;
    const inner = (e && typeof e.error === "object") ? e.error : e;
    return (inner && inner.message) || (typeof e?.error === "string" ? e.error : "") || "";
  };
  const isOverload = (status, msg) =>
    [500, 502, 503, 504, 529].includes(status) ||
    /overload|high demand|unavailable|try again later|capacity/i.test(msg || "");

  const MAX_TRIES = 3;
  const RETRY_WAIT = [2500, 6000];

  (async () => {
    for (let attempt = 1; attempt <= MAX_TRIES; attempt++) {
      let full = "";
      // transient failure before any text arrived → retry automatically
      const retryOrFail = async msg => {
        if (attempt < MAX_TRIES) {
          handlers.onRetry && handlers.onRetry(attempt, MAX_TRIES);
          await new Promise(r => setTimeout(r, RETRY_WAIT[attempt - 1]));
          return true;
        }
        handlers.onError(msg);
        return false;
      };

      try {
        const res = await fetch(url, {
          method: "POST",
          signal: controller.signal,
          headers,
          body: JSON.stringify(body),
        });

        if (!res.ok) {
          let msg = "", code = "", rawErr = "";
          try {
            const err = await res.json();
            rawErr = JSON.stringify(err);
            code = typeof err?.error === "string" ? err.error : "";
            msg = extractErrMsg(err) || code;
          } catch (_) { /* non-JSON error body */ }

          if (P.protocol === "cloud") {
            if (code === "trial_over") { handlers.onError("التجربة المجانية خلصت 🎬 — فعّل الاشتراك (10$/شهر) عشان تكمل"); return; }
            if (code === "daily_cap") { handlers.onError("وصلت للحد اليومي — كمّل بكرة أو فعّل الاشتراك"); return; }
            if (res.status === 401) { handlers.onError("الجلسة انتهت — سجّل بإيميلك تاني من الإعدادات ⚙️"); return; }
          } else {
            if (res.status === 401 || res.status === 403) {
              handlers.onError(`مفتاح ${P.label.replace(/^[^ ]+ /, "")} غير صحيح — راجع الإعدادات ⚙️`);
              return;
            }
          }
          if (isOverload(res.status, msg)) {
            if (await retryOrFail(T("err_overload"))) continue;
            return;
          }
          if (res.status === 429) {
            // daily free quota is gone → waiting won't help, say so plainly
            if (/PerDay|per_day|daily/i.test(rawErr + msg)) {
              handlers.onError(T("err_quota_day"));
              return;
            }
            // per-minute limit → wait the delay Google suggests, then continue
            const sug = (rawErr.match(/"retryDelay"\s*:\s*"?(\d+)/) || [])[1];
            const waitMs = Math.min(Math.max((parseInt(sug, 10) || 30), 15), 90) * 1000;
            if (attempt < MAX_TRIES) {
              handlers.onRetry && handlers.onRetry(attempt, MAX_TRIES, waitMs);
              await new Promise(r => setTimeout(r, waitMs));
              continue;
            }
            handlers.onError(T("err_rate"));
            return;
          }
          handlers.onError(msg || `HTTP ${res.status}`);
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "", streamErr = null;

        readloop:
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });

          const frames = buf.split("\n\n");
          buf = frames.pop();
          for (const frame of frames) {
            for (const line of frame.split("\n")) {
              if (!line.startsWith("data:")) continue;
              const payload = line.slice(5).trim();
              if (payload === "[DONE]") continue;
              let ev;
              try { ev = JSON.parse(payload); } catch (_) { continue; }

              let delta = "";
              if (P.protocol === "anthropic") {
                if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") delta = ev.delta.text;
                else if (ev.type === "message_delta" && ev.delta?.stop_reason === "refusal") {
                  handlers.onError(T("err_refusal"));
                  return;
                } else if (ev.type === "error") {
                  streamErr = extractErrMsg(ev) || T("err_server");
                  break readloop;
                }
              } else {
                delta = ev.choices?.[0]?.delta?.content || "";
                if (ev.error) {
                  streamErr = extractErrMsg(ev) || T("err_server");
                  break readloop;
                }
              }
              if (delta) {
                full += delta;
                handlers.onText(delta);
              }
            }
          }
        }

        if (streamErr) {
          // overload errors can arrive mid-stream with HTTP 200 — retry those too
          if (!full && isOverload(0, streamErr)) {
            if (await retryOrFail(T("err_overload"))) continue;
            return;
          }
          handlers.onError(streamErr);
          return;
        }
        handlers.onDone(full);
        return;
      } catch (e) {
        if (e.name === "AbortError") { handlers.onDone(full); return; }
        if (await retryOrFail(T("err_conn") + " (" + P.label.replace(/^[^ ]+ /, "") + ")")) continue;
        return;
      }
    }
  })();

  return controller;
}

/* ---------- cloud account (Film-trend backend) ---------- */
async function cloudSignup(email) {
  const res = await fetch(backendUrl() + "/signup", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ email }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "signup failed");
  localStorage.setItem("fta_cloud_token", data.token);
  localStorage.setItem("fta_cloud_email", email);
  return data.usage;

async function cloudUsage() {
  const token = localStorage.getItem("fta_cloud_token");
  if (!token || !backendUrl()) return null;
  const res = await fetch(backendUrl() + "/me", {
    headers: { authorization: "Bearer " + token },
  });
  if (!res.ok) return null;
  return (await res.json()).usage;
}

/* read a File (PDF) as a base64 string without data: prefix */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ============================================================
   FILM-TREND AI — UI logic
   Steps: script (brief + specs) / storyboard / voice / settings.
   Streams LLM output (any configured provider) and renders markdown.
   All user-visible strings go through t() (js/i18n.js).
   ============================================================ */

let activeController = null;

/* ---------- tiny markdown renderer (headings, bold, lists, tables, code) ---------- */
function mdToHtml(md) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const lines = md.split("\n");
  let html = "", inCode = false, inList = false, inTable = false;

  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");

  // dir="auto" makes each block flow by its own language (Arabic → RTL,
  // English prompts → LTR) so mixed output always reads clean.
  const closeBlocks = () => {
    if (inList) { html += "</ul>"; inList = false; }
    if (inTable) { html += "</table></div>"; inTable = false; }
  };

  for (const line of lines) {
    if (line.startsWith("```")) {
      closeBlocks();
      html += inCode ? "</pre>" : "<pre>";
      inCode = !inCode;
      continue;
    }
    if (inCode) { html += esc(line) + "\n"; continue; }

    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { closeBlocks(); html += `<h${h[1].length + 1} dir="auto">${inline(h[2])}</h${h[1].length + 1}>`; continue; }

    if (/^\s*[-*•]\s+/.test(line)) {
      if (inTable) { html += "</table></div>"; inTable = false; }
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li dir="auto">${inline(line.replace(/^\s*[-*•]\s+/, ""))}</li>`;
      continue;
    }

    if (/^\s*\|/.test(line)) {
      if (inList) { html += "</ul>"; inList = false; }
      if (/^\s*\|[\s:|-]+\|\s*$/.test(line)) continue; // separator row
      if (!inTable) { html += '<div class="tblw"><table>'; inTable = true; }
      const cells = line.trim().replace(/^\||\|$/g, "").split("|");
      html += "<tr>" + cells.map(c => `<td dir="auto">${inline(c.trim())}</td>`).join("") + "</tr>";
      continue;
    }

    if (/^\s*(---|━+)\s*$/.test(line)) { closeBlocks(); html += "<hr>"; continue; }
    if (line.trim() === "") { closeBlocks(); continue; }

    closeBlocks();
    html += `<p dir="auto">${inline(line)}</p>`;
  }
  if (inCode) html += "</pre>";
  if (inList) html += "</ul>";
  if (inTable) html += "</table></div>";
  return html;
}

/* ---------- shoot list (scenes × seconds, script tab) ---------- */
let shootScenes = Math.min(15, Math.max(1, parseInt(localStorage.getItem("fta_scenes") || "6", 10) || 6));
let shootSecs = parseInt(localStorage.getItem("fta_secs") || "10", 10) || 10;

function scenesStep(d) {
  shootScenes = Math.min(15, Math.max(1, shootScenes + d));
  localStorage.setItem("fta_scenes", shootScenes);
  renderShootList();
}
function setSecs(v) {
  shootSecs = v;
  localStorage.setItem("fta_secs", v);

function renderShootList() {

  if (!val) return;
  val.textContent = shootScenes;
  document.querySelectorAll("#sl-chips button").forEach(b =>
    b.classList.toggle("on", +b.dataset.secs === shootSecs));

    ? `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")} (${total}s)`
    : `${total}s`;
  document.getElementById("sl-total").textContent = t("sl_total").replace("{t}", pretty);

/* one line describing an auto-retry, incl. rate-limit countdowns */
function retryMsg(attempt, max, waitMs) {
  const base = waitMs && waitMs > 10000
    ? t("retrying_rate").replace("{s}", Math.round(waitMs / 1000))
    : t("retrying");
  return `${base} (${attempt}/${max})`;
}

function startRun(tool, text, sysAddon, images) {
  if (!checkReady()) return;
  if (activeController) activeController.abort();

  const out = document.getElementById(`out-${tool}`);
  const btn = document.getElementById(`run-${tool}`);
  const stop = document.getElementById(`stop-${tool}`);
  out.innerHTML = `<p class="thinking">${t("thinking")}</p>`;
  out.dataset.raw = "";
  btn.disabled = true;
  stop.style.display = "inline-flex";

  activeController = runLLM([{ role: "user", text, images: images || [] }], {
    onRetry(attempt, max, waitMs) {
      out.innerHTML = `<p class="thinking">${retryMsg(attempt, max, waitMs)}</p>`;
    },
    onText(delta) {
      out.dataset.raw += delta;
      out.innerHTML = mdToHtml(out.dataset.raw);
      out.scrollTop = out.scrollHeight;
    },
    onDone(full) {
      btn.disabled = false;
      stop.style.display = "none";
      activeController = null;
      if (!full.trim()) {
        out.innerHTML = `<p class="thinking">${t("no_result")}</p>`;
        return;
      }
      out.innerHTML = mdToHtml(full);
      document.getElementById(`actions-${tool}`).style.display = "flex";
      markStepDone(tool);
      if (tool === "board") {
        boardView = "full";
        const sb = document.getElementById("split-board");
        if (sb) sb.textContent = t("split");
        // auto-pipeline: split into scene cards and draw the b/w
        // sketches in scene order, one after the other
        if (document.getElementById("board-sketch").checked) {
          setTimeout(() => {
            // no Gemini key → skip the auto-run quietly; the manual buttons explain what's needed
            if (!(localStorage.getItem("fta_key_gemini") || "").trim()) { toast(t("sk_no_key")); return; }
            if (boardView === "full") toggleBoardView();
            if ((window._scenes || []).length) {
              toast(t("sk_auto"));
              drawAllSketches();
            }
          }, 80);
        }
      }
      if (tool === "script") {
        lastScript = full;
        const carry = document.getElementById("carry-note");
        if (carry) carry.style.display = "block";
      }
    },
    onError(msg) {
      btn.disabled = false;
      stop.style.display = "none";
      activeController = null;
      out.innerHTML = `<p class="err">⚠️ ${msg}</p>`;
    },
  }, sysAddon ? { system: SYSTEM_PROMPT + sysAddon } : {});
}

function stopRun(tool) {
  if (activeController) activeController.abort();
  document.getElementById(`run-${tool}`).disabled = false;
  document.getElementById(`stop-${tool}`).style.display = "none";
}

function copyOut(tool) {
  navigator.clipboard.writeText(document.getElementById(`out-${tool}`).dataset.raw || "")
    .then(() => toast(t("t_copied")));
}

function downloadOut(tool, name) {
  const blob = new Blob([document.getElementById(`out-${tool}`).dataset.raw || ""], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
