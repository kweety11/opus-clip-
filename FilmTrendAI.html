<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film-trend AI</title>
  <meta name="description" content="خطة سوشيال ميديا، سيناريو، استوري بورد ببرومبتات جاهزة، وفويس أوفر بأصوات جوجل — بأي موديل AI في السوق.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f2b23e'/><text x='16' y='23' text-anchor='middle' font-size='18'>🎬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   FILM-TREND AI — professional SaaS design system (RTL, Arabic)
   Type: Cairo (variable) · dark premium palette · gold accent
   ============================================================ */
:root {
  --bg: #0a0c11;
  --bg-2: #0d1017;
  --surface: #131722;
  --surface-2: #1a1f2d;
  --line: #242b3d;
  --line-soft: #1c2231;
  --text: #f0eee8;
  --muted: #98a0b3;
  --faint: #5d6579;
  --accent: #f2b23e;
  --accent-deep: #e8862d;
  --accent-grad: linear-gradient(120deg, #f6c15a, #f2b23e 45%, #e8862d);
  --teal: #43cabb;
  --err: #e0564f;
  --r-lg: 20px;
  --r: 14px;
  --r-sm: 10px;
  --shadow-lg: 0 24px 70px rgba(0, 0, 0, .55);
  --shadow: 0 10px 34px rgba(0, 0, 0, .38);
  --font: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}

::selection { background: rgba(242, 178, 62, .3); }
a { color: inherit; text-decoration: none; }
img, svg { max-width: 100%; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 0 28px; }

/* ============ header ============ */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10, 12, 17, .78);
  backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid var(--line-soft);
}
.site-header .wrap { display: flex; align-items: center; gap: 30px; height: 72px; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 20px; cursor: pointer; }
.brand .mark {
  width: 38px; height: 38px; border-radius: 11px; flex: none;
  background: var(--accent-grad);
  display: grid; place-items: center; font-size: 19px;
  box-shadow: 0 6px 18px rgba(242, 178, 62, .35);
}
.brand em { font-style: normal; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.head-nav { display: flex; gap: 6px; flex: 1; }
.head-nav a {
  padding: 8px 16px; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--muted);
  transition: color .15s, background .15s;
}
.head-nav a:hover { color: var(--text); background: var(--surface); }

/* ============ buttons ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 12px 26px; border-radius: 12px; border: 1px solid transparent;
  font: inherit; font-size: 15.5px; font-weight: 800; cursor: pointer; line-height: 1.4;
  transition: transform .13s, box-shadow .2s, background .15s, border-color .15s;
  white-space: nowrap;
}
.btn:active { transform: translateY(1.5px); }
.btn:disabled { opacity: .5; cursor: wait; }
.btn-primary {
  background: var(--accent-grad); color: #201302;
  box-shadow: 0 8px 26px rgba(242, 178, 62, .3);
}
.btn-primary:hover:not(:disabled) { box-shadow: 0 12px 34px rgba(242, 178, 62, .45); transform: translateY(-1px); }
.btn-ghost { border-color: var(--line); color: var(--text); background: rgba(255, 255, 255, .02); }
.btn-ghost:hover { border-color: var(--muted); background: var(--surface); }
.btn-lg { padding: 16px 36px; font-size: 17px; border-radius: 14px; }
.btn-sm { padding: 8px 18px; font-size: 13.5px; font-weight: 700; }
.btn-xs { padding: 5px 13px; font-size: 12px; font-weight: 700; border-radius: 8px; }
.btn-block { width: 100%; margin-top: 20px; }
.btn-stop { background: var(--err); color: #fff; display: none; width: 100%; margin-top: 10px; }

/* ============ landing ============ */
.hero {
  position: relative; overflow: hidden; text-align: center;
  padding: 110px 0 90px;
}
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(720px 420px at 50% -8%, rgba(242, 178, 62, .16), transparent 65%),
    radial-gradient(560px 380px at 12% 28%, rgba(232, 134, 45, .08), transparent 60%),
    radial-gradient(560px 380px at 88% 32%, rgba(67, 202, 187, .07), transparent 60%);
}
.hero > .wrap { position: relative; }
.kicker {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 18px; border-radius: 999px;
  border: 1px solid rgba(242, 178, 62, .35); background: rgba(242, 178, 62, .08);
  color: var(--accent); font-size: 13.5px; font-weight: 700; margin-bottom: 26px;
}
.hero h1 {
  font-size: clamp(40px, 6.4vw, 72px); font-weight: 900; line-height: 1.22;
  letter-spacing: -.5px; margin-bottom: 22px;
}
.hero h1 .grad { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .sub { max-width: 640px; margin: 0 auto 40px; color: var(--muted); font-size: 19px; font-weight: 500; }
.hero-ctas { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.hero-stats {
  display: flex; gap: 56px; justify-content: center; margin-top: 64px; flex-wrap: wrap;
}
.hero-stats b { display: block; font-size: 34px; font-weight: 900; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-stats span { color: var(--muted); font-size: 14px; font-weight: 600; }

.section { padding: 96px 0; }
.section.alt { background: var(--bg-2); border-block: 1px solid var(--line-soft); }
.sec-head { text-align: center; max-width: 620px; margin: 0 auto 56px; }
.sec-head h2 { font-size: clamp(28px, 4vw, 42px); font-weight: 900; margin-bottom: 12px; }
.sec-head p { color: var(--muted); font-size: 17px; }

.feat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.feat {
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-lg);
  padding: 30px 26px; position: relative; overflow: hidden;
  transition: transform .2s, border-color .2s, box-shadow .25s;
}
.feat:hover { transform: translateY(-5px); border-color: #313a52; box-shadow: var(--shadow); }
.feat .num {
  position: absolute; top: 14px; inset-inline-end: 20px;
  font-size: 44px; font-weight: 900; color: rgba(242, 178, 62, .1); line-height: 1;
}
.feat .ico {
  width: 52px; height: 52px; border-radius: 15px; margin-bottom: 20px;
  display: grid; place-items: center; font-size: 25px;
  background: linear-gradient(135deg, rgba(242, 178, 62, .16), rgba(232, 134, 45, .08));
  border: 1px solid rgba(242, 178, 62, .22);
}
.feat h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
.feat p { color: var(--muted); font-size: 14px; line-height: 1.75; }

.how-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; counter-reset: hstep; }
.how {
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r);
  padding: 26px 22px; text-align: center;
}
.how::before {
  counter-increment: hstep; content: counter(hstep);
  display: grid; place-items: center; width: 46px; height: 46px; margin: 0 auto 16px;
  border-radius: 50%; background: var(--accent-grad); color: #201302;
  font-size: 20px; font-weight: 900;
}
.how p { font-size: 15px; font-weight: 700; }

.price-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 420px)); gap: 22px; justify-content: center; }
.price {
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-lg);
  padding: 38px 34px; display: flex; flex-direction: column;
}
.price.hot {
  border-color: rgba(242, 178, 62, .55); position: relative;
  background: linear-gradient(180deg, rgba(242, 178, 62, .08), transparent 45%), var(--surface);
  box-shadow: 0 16px 50px rgba(242, 178, 62, .12);
}
.price .flag {
  position: absolute; top: -14px; inset-inline-start: 50%; transform: translateX(50%);
  background: var(--accent-grad); color: #201302; font-size: 12px; font-weight: 900;
  padding: 5px 18px; border-radius: 999px;
}
[dir="ltr"] .price .flag { transform: translateX(-50%); }
.price h3 { font-size: 19px; font-weight: 800; }
.price .amount { font-size: 52px; font-weight: 900; margin: 14px 0 4px; }
.price .amount small { font-size: 15px; color: var(--muted); font-weight: 600; }
.price ul { list-style: none; margin: 22px 0 30px; flex: 1; }
.price li { padding: 9px 0; font-size: 15px; color: #cdd2e0; display: flex; gap: 11px; font-weight: 600; }
.price li::before { content: "✓"; color: var(--teal); font-weight: 900; }
.price-note { text-align: center; color: var(--faint); font-size: 13px; margin-top: 18px; }

.site-footer { border-top: 1px solid var(--line-soft); padding: 44px 0; text-align: center; color: var(--muted); font-size: 14px; }

/* ============ studio ============ */
body.in-studio #landing { display: none; }
#studio { display: none; }
body.in-studio #studio { display: block; }

.stepper-bar {
  border-bottom: 1px solid var(--line-soft); background: var(--bg-2);
  position: sticky; top: 72px; z-index: 90;
}
.stepper { display: flex; align-items: stretch; gap: 4px; overflow-x: auto; padding: 12px 0; }
.step-btn {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 20px; border-radius: 12px; cursor: pointer;
  border: 1px solid transparent; background: transparent; color: var(--muted);
  font: inherit; font-size: 15px; font-weight: 700; white-space: nowrap;
  transition: all .15s;
}
.step-btn:hover { color: var(--text); background: var(--surface); }
.step-btn.on { background: var(--surface); border-color: var(--line); color: var(--accent); }
.step-btn .n {
  display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface-2); border: 1.5px solid var(--line); color: var(--muted);
  font-size: 13.5px; font-weight: 800; transition: all .15s;
}
.step-btn.on .n { background: var(--accent-grad); border-color: transparent; color: #201302; }
.step-btn.done .n { background: var(--teal); border-color: transparent; color: #06231f; }
.step-btn.done .n::before { content: "✓"; }
.step-btn.done .n span { display: none; }
.step-sep { align-self: center; width: 26px; height: 2px; background: var(--line); border-radius: 2px; flex: none; }
.step-gear { margin-inline-start: auto; }

.panel { display: none; padding: 34px 0 90px; }
.panel.show { display: block; }
.panel-grid { display: grid; grid-template-columns: 410px 1fr; gap: 24px; align-items: start; }

.card {
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: var(--r-lg); padding: 28px;
  box-shadow: var(--shadow);
}
.card h3 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
.card .hint { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; line-height: 1.8; }

label.f { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 7px; }
textarea, input[type="text"], input[type="password"], select {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1.5px solid var(--line); border-radius: var(--r-sm);
  padding: 12px 15px; font: inherit; font-size: 14.5px; font-weight: 500;
  outline: none; transition: border-color .15s, box-shadow .15s;
}
textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(242, 178, 62, .13); }
textarea { resize: vertical; min-height: 130px; }

/* two form fields side by side (script specs) */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
@media (max-width: 560px) { .two-col { grid-template-columns: 1fr; } }

/* checkbox row */
label.check {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  margin: 16px 0 4px; font-size: 14px; font-weight: 700; color: var(--text);
}
label.check input[type="checkbox"] {
  width: 19px; height: 19px; flex: none; accent-color: var(--accent); cursor: pointer;
}

.upload {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px dashed var(--line); border-radius: var(--r-sm);
  padding: 17px; color: var(--muted); font-size: 14px; font-weight: 700; cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
}
.upload:hover { border-color: var(--accent); color: var(--text); background: rgba(242, 178, 62, .04); }
.upload input { display: none; }
#pdf-name { color: var(--teal); font-size: 13px; font-weight: 700; margin-top: 8px; }

/* output */
.out {
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: var(--r-lg); padding: 28px 30px;
  min-height: 380px; max-height: 74vh; overflow: auto;
  font-size: 15px; box-shadow: var(--shadow);
}
.out:empty::before { content: "الناتج هيظهر هنا…"; color: var(--faint); font-weight: 600; }
html[lang="en"] .out:empty::before { content: "Output will appear here…"; }
.md h2, .md h3, .md h4, .md h5 { margin: 22px 0 8px; color: var(--accent); font-weight: 800; }
.md h2 { font-size: 21px; } .md h3 { font-size: 17.5px; } .md h4 { font-size: 15.5px; }
.md p { margin: 7px 0; }
.md ul { margin: 8px 22px 8px 0; }
[dir="ltr"] .md ul { margin: 8px 0 8px 22px; }
.md li { margin: 4px 0; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.md code {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 1px 8px; font-size: 13px; font-family: var(--mono);
  direction: ltr; unicode-bidi: embed;
}
.md pre {
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 15px 17px; margin: 13px 0; overflow-x: auto;
  font-size: 13px; line-height: 1.65; font-family: var(--mono);
  direction: ltr; text-align: left;
}
.md table { border-collapse: collapse; margin: 14px 0; width: 100%; font-size: 13.5px; }
.md td { border: 1px solid var(--line); padding: 8px 12px; vertical-align: top; }
.md tr:first-child td { background: var(--surface-2); font-weight: 800; }
.md .thinking, .out .thinking { color: var(--muted); font-weight: 600; }
.md .err, .out .err { color: var(--err); font-weight: 700; }

.actions { display: none; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

#carry-note {
  display: none; margin-top: 14px; padding: 12px 17px;
  background: rgba(67, 202, 187, .08); border: 1px solid rgba(67, 202, 187, .35);
  border-radius: var(--r-sm); color: var(--teal); font-size: 13.5px; font-weight: 700;
}

/* scene cards */
.scene-card {
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--surface-2); padding: 18px 20px; margin-bottom: 18px;
}
.scene-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.scene-head b { color: var(--accent); font-size: 15px; font-weight: 800; }
.scene-prompt { margin-top: 12px; }
.sp-head { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--teal); font-weight: 800; margin-bottom: 6px; }
.scene-prompt pre {
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 12px 14px; margin: 0; overflow-x: auto;
  font-size: 12.5px; line-height: 1.65; white-space: pre-wrap;
  direction: ltr; text-align: left; font-family: var(--mono);
}

/* markdown tables scroll inside their own wrapper — never break layout */
.tblw { overflow-x: auto; max-width: 100%; margin: 14px 0; border-radius: var(--r-sm); }
.md .tblw table { margin: 0; }

/* ============ planning chat ============ */
.chat-shell { max-width: 880px; margin: 0 auto; }
.chat-card { display: flex; flex-direction: column; height: min(72vh, 760px); padding: 18px; }
.chat-log {
  flex: 1; overflow-y: auto; display: flex; flex-direction: column;
  gap: 14px; padding: 6px 4px 14px;
}
.msg {
  max-width: 88%; padding: 13px 18px; border-radius: 16px;
  font-size: 14.5px; line-height: 1.85; overflow-wrap: break-word;
}
.msg.user {
  align-self: flex-start;
  background: rgba(242, 178, 62, .12); border: 1px solid rgba(242, 178, 62, .3);
  border-start-start-radius: 4px;
}
.msg.ai {
  align-self: flex-end;
  background: var(--surface-2); border: 1px solid var(--line);
  border-start-end-radius: 4px;
  max-width: 94%;
}
.msg .chip { display: inline-block; margin-top: 7px; }
.chip {
  background: rgba(67, 202, 187, .1); border: 1px solid rgba(67, 202, 187, .35);
  color: var(--teal); border-radius: 8px; padding: 2px 10px;
  font-size: 12px; font-weight: 700;
}
.chip:empty { display: none; }
.chat-input {
  display: flex; gap: 10px; align-items: flex-end;
  border-top: 1px solid var(--line-soft); padding-top: 14px;
}
.chat-input textarea { flex: 1; min-height: 46px; max-height: 130px; resize: none; }
.attach {
  display: grid; place-items: center; width: 46px; height: 46px; flex: none;
  border: 1.5px dashed var(--line); border-radius: var(--r-sm);
  font-size: 18px; cursor: pointer; transition: border-color .15s;
}
.attach:hover { border-color: var(--accent); }
.attach input { display: none; }
.chat-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 10px; flex-wrap: wrap; }

/* voice-over */
.voice-result { display: none; margin-top: 18px; }
.voice-result audio { width: 100%; margin-bottom: 12px; }
.voice-status { color: var(--muted); font-size: 14px; font-weight: 700; margin-top: 14px; }
.voice-status.err { color: var(--err); }

/* settings */
.settings-card { max-width: 620px; margin: 0 auto; }
.mode-switch { display: flex; gap: 12px; margin-bottom: 22px; }
.mode-btn {
  flex: 1; padding: 16px 12px; border-radius: var(--r); cursor: pointer;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--muted);
  font: inherit; font-size: 15px; font-weight: 800; text-align: center;
  transition: border-color .15s, color .15s, background .15s;
}
.mode-btn small { display: block; font-weight: 500; font-size: 12px; margin-top: 4px; color: var(--faint); }
.mode-btn:hover { color: var(--text); }
.mode-btn.on { border-color: var(--accent); color: var(--accent); background: rgba(242, 178, 62, .06); }
.mode-btn.on small { color: var(--muted); }
.note {
  margin-top: 16px; padding: 13px 17px; border-radius: var(--r-sm);
  background: rgba(242, 178, 62, .06); border: 1px solid rgba(242, 178, 62, .25);
  color: var(--muted); font-size: 13.5px; line-height: 1.8;
}
.note b { color: var(--accent); }

/* toast */
.toast {
  position: fixed; bottom: 28px; right: 50%; transform: translate(50%, 16px);
  background: var(--surface-2); border: 1px solid var(--line);
  color: var(--text); padding: 13px 26px; border-radius: 13px;
  font-size: 14.5px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 300; box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translate(50%, 0); }

/* responsive */
@media (max-width: 1020px) {
  .feat-grid, .how-grid { grid-template-columns: 1fr 1fr; }
  .panel-grid { grid-template-columns: 1fr; }
  .head-nav { display: none; }
}
@media (max-width: 620px) {
  .feat-grid, .how-grid, .price-grid { grid-template-columns: 1fr; }
  .hero { padding: 70px 0 60px; }
  .hero-stats { gap: 30px; }
  .mode-switch { flex-direction: column; }
}

</style>
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <div class="wrap">
      <div class="brand" onclick="goLanding()">
        <span class="mark">🎬</span>
        <span>Film-trend <em>AI</em></span>
      </div>
      <nav class="head-nav" id="head-nav">
        <a href="#features" onclick="goLanding()" data-i18n="nav_features">المميزات</a>
        <a href="#pricing" onclick="goLanding()" data-i18n="nav_pricing">الأسعار</a>
      </nav>
      <button class="btn btn-ghost btn-sm" id="lang-btn" onclick="toggleLang()">EN</button>
      <button class="btn btn-primary btn-sm" onclick="openStudio()" data-i18n="open_studio">افتح الاستوديو ←</button>
    </div>
  </header>

  <!-- ================= LANDING ================= -->
  <div id="landing">

    <section class="hero">

let LANG = localStorage.getItem("fta_lang") || "ar";

function t(key) { return (I18N[LANG] && I18N[LANG][key]) ?? I18N.ar[key] ?? key; }

function applyLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  const btn = document.getElementById("lang-btn");
  if (btn) btn.textContent = LANG === "ar" ? "EN" : "عربي";
}

function toggleLang() {
  LANG = LANG === "ar" ? "en" : "ar";
  localStorage.setItem("fta_lang", LANG);
  applyLang();
}

/* ============================================================
   FILM-TREND AI — universal document reader (client-side)
   Extracts text from PDF / DOCX / PPTX / TXT locally in the
   browser, so documents work with EVERY provider. Images are
   passed through as vision blocks.
   Libraries load lazily from CDN only when first needed.
   ============================================================ */

const _libCache = {};
function loadLib(url) {
  if (_libCache[url]) return _libCache[url];
  _libCache[url] = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = url;
    s.onload = resolve;
    s.onerror = () => reject(new Error("فشل تحميل مكتبة القراءة — اتأكد من الإنترنت"));
    document.head.appendChild(s);
  });
  return _libCache[url];
}

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const MAMMOTH = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js";
const JSZIP = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";

/**
 * extractDocument(file) →
 *   { text }                          for pdf/docx/pptx/txt
 *   { image: { mime, b64 } }          for images (vision)
 */
async function extractDocument(file) {
  const name = file.name.toLowerCase();
  const MAX = 25 * 1024 * 1024;
  if (file.size > MAX) throw new Error("الملف أكبر من 25MB");

  if (file.type.startsWith("image/")) {
    return { image: { mime: file.type, b64: await fileToBase64(file) } };
  }
  if (name.endsWith(".txt") || name.endsWith(".md")) {
    return { text: await file.text() };
  }
  if (name.endsWith(".pdf")) return { text: await extractPdf(file) };
  if (name.endsWith(".docx")) return { text: await extractDocx(file) };
  if (name.endsWith(".pptx")) return { text: await extractPptx(file) };
  throw new Error("صيغة غير مدعومة — المدعوم: PDF, Word, PowerPoint, صور, نص");
}

async function extractPdf(file) {
  await loadLib(PDFJS);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let out = [];
  const pages = Math.min(pdf.numPages, 80);
  for (let i = 1; i <= pages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    out.push(tc.items.map(it => it.str).join(" "));
  }
  const text = out.join("\n\n").trim();
  if (!text) throw new Error("الـ PDF ده صور مش نصوص — جرّب ترفعه كصورة أو انسخ النص");
  return text;
}

async function extractDocx(file) {
  await loadLib(MAMMOTH);
  const result = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
  const text = (result.value || "").trim();
  if (!text) throw new Error("معرفتش أقرا نص من ملف الـ Word ده");
  return text;
}

async function extractPptx(file) {
  await loadLib(JSZIP);
  const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
  const slideNames = Object.keys(zip.files)
    .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a, b) => parseInt(a.match(/\d+/)) - parseInt(b.match(/\d+/)));
  const slides = [];
  for (const n of slideNames) {
    const xml = await zip.files[n].async("string");
    const runs = [...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m => m[1]);
    if (runs.length) slides.push(`— شريحة ${slides.length + 1} —\n` + runs.join(" "));
  }
  const text = slides.join("\n\n").trim();
  if (!text) throw new Error("معرفتش أقرا نص من ملف الـ PowerPoint ده");
  return text;
}

/**
 * Generate speech. Returns a WAV Blob.
 */
async function ttsGenerate(text, voiceName, stylePrefix) {
  const key = localStorage.getItem("fta_key_gemini") || "";
  if (!key) throw new Error("NO_KEY");

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent?key=${encodeURIComponent(key)}`,
    {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: (stylePrefix || "") + text }] }],
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } },
        },
      }),
    }
  );

  if (!res.ok) {
    let msg = "HTTP " + res.status;
    try { msg = (await res.json())?.error?.message || msg; } catch (_) { /* ignore */ }
    if (res.status === 400 || res.status === 403) throw new Error("BAD_KEY:" + msg);
    if (res.status === 429) throw new Error("RATE:" + msg);
    throw new Error(msg);
  }

  const data = await res.json();
  const part = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
  if (!part) throw new Error("no audio in response");

  // Gemini TTS returns raw 16-bit PCM; sample rate is in the mimeType (rate=24000)
  const rate = parseInt((part.inlineData.mimeType.match(/rate=(\d+)/) || [, "24000"])[1], 10);
  const pcm = Uint8Array.from(atob(part.inlineData.data), c => c.charCodeAt(0));
  return pcmToWav(pcm, rate);
}

/* wrap raw 16-bit mono PCM in a WAV container so <audio> can play it */
function pcmToWav(pcm, sampleRate) {
  const header = new ArrayBuffer(44);
  const v = new DataView(header);
  const str = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
  str(0, "RIFF");
  v.setUint32(4, 36 + pcm.length, true);
  str(8, "WAVE");
  str(12, "fmt ");
  v.setUint32(16, 16, true);        // fmt chunk size
  v.setUint16(20, 1, true);         // PCM
  v.setUint16(22, 1, true);         // mono
  v.setUint32(24, sampleRate, true);
  v.setUint32(28, sampleRate * 2, true); // byte rate
  v.setUint16(32, 2, true);         // block align
  v.setUint16(34, 16, true);        // bits per sample
  str(36, "data");
  v.setUint32(40, pcm.length, true);
  return new Blob([header, pcm], { type: "audio/wav" });
}

  return (localStorage.getItem("fta_backend") || FT_BACKEND_URL || "").replace(/\/+$/, "");
}

/* ============================================================
   streaming client — returns AbortController
   content: array of blocks [{type:"text",text}] and optionally
   one {type:"document", source:{...}} (Claude only)
   ============================================================ */
/**
 * runLLM(messages, handlers, opts)
 * messages: neutral history — [{role:"user"|"assistant", text, images?:[{mime,b64}]}]
 * opts.system: override the system prompt (defaults to SYSTEM_PROMPT)
 */
function runLLM(messages, handlers, opts = {}) {
  const { mode, cloudToken, provider, apiKey, model } = getSettings();
  const P = mode === "cloud" ? { protocol: "cloud", label: "☁️ حساب Film-trend" } : PROVIDERS[provider];
  const controller = new AbortController();
  const system = opts.system || SYSTEM_PROMPT;
  const hasImages = messages.some(m => m.images && m.images.length);

  let url, headers, body;

  if (P.protocol === "cloud") {
    if (hasImages) {
      handlers.onError("رفع الصور متاح في وضع المفتاح الخاص — في حساب Film-trend ارفع مستندات نصية (PDF/Word/PPTX)");
      return controller;
    }
    url = backendUrl() + "/generate";
    headers = { "content-type": "application/json", "authorization": "Bearer " + cloudToken };
    // the worker takes a single user string — flatten the conversation
    const flat = messages.map(m =>
      (m.role === "assistant" ? "ASSISTANT:\n" : "USER:\n") + m.text).join("\n\n");
    body = { system, user: flat };
  } else if (P.protocol === "anthropic") {
    url = P.url;
    headers = {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    };
    body = {
      model,
      max_tokens: 64000,
      stream: true,
      system,
      messages: messages.map(m => ({
        role: m.role,
        content: [
          ...(m.images || []).map(im => ({
            type: "image",
            source: { type: "base64", media_type: im.mime, data: im.b64 },
          })),
          { type: "text", text: m.text },
        ],
      })),
    };
    if (!model.startsWith("claude-haiku")) body.thinking = { type: "adaptive" };
  } else {
    url = P.url;
    headers = { "content-type": "application/json", "authorization": "Bearer " + apiKey };
    if (provider === "openrouter") {
      headers["HTTP-Referer"] = "https://film-trend.ai";
      headers["X-Title"] = "Film-trend AI";
    }
    body = {
      model,
      stream: true,
      messages: [
        { role: "system", content: system },
        ...messages.map(m => ({
          role: m.role,
          content: (m.images && m.images.length)
            ? [
                ...m.images.map(im => ({ type: "image_url", image_url: { url: `data:${im.mime};base64,${im.b64}` } })),
                { type: "text", text: m.text },
              ]
            : m.text,
        })),
      ],
    };
  }

  (async () => {
    let full = "";
    try {
      const res = await fetch(url, {
        method: "POST",
        signal: controller.signal,
        headers,
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        let msg = `HTTP ${res.status}`, code = "";
        try {
          const err = await res.json();
          code = typeof err?.error === "string" ? err.error : "";
          msg = err?.error?.message || code || err?.message || JSON.stringify(err).slice(0, 200);
        } catch (_) { /* non-JSON error body */ }
        if (P.protocol === "cloud") {
          if (code === "trial_over") msg = "التجربة المجانية خلصت 🎬 — فعّل الاشتراك (10$/شهر) عشان تكمل";
          else if (code === "daily_cap") msg = "وصلت للحد اليومي — كمّل بكرة أو فعّل الاشتراك";
          else if (res.status === 401) msg = "الجلسة انتهت — سجّل بإيميلك تاني من الإعدادات ⚙️";
        } else {
          if (res.status === 401 || res.status === 403) msg = `مفتاح ${P.label.replace(/^[^ ]+ /, "")} غير صحيح — راجع الإعدادات ⚙️`;
          if (res.status === 429) msg = "تجاوزت حد الطلبات أو الرصيد خلص — راجع حسابك عند المزود";
        }
        handlers.onError(msg);
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        const frames = buf.split("\n\n");
        buf = frames.pop();
        for (const frame of frames) {
          for (const line of frame.split("\n")) {
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (payload === "[DONE]") continue;
            let ev;
            try { ev = JSON.parse(payload); } catch (_) { continue; }

            let delta = "";
            if (P.protocol === "anthropic") {
              if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") delta = ev.delta.text;
              else if (ev.type === "message_delta" && ev.delta?.stop_reason === "refusal") {
                handlers.onError("الطلب اترفض لأسباب تتعلق بسياسة الاستخدام — جرّب تعيد صياغته");
                return;
              } else if (ev.type === "error") {
                handlers.onError(ev.error?.message || "خطأ من الخادم");
                return;
              }
            } else {
              delta = ev.choices?.[0]?.delta?.content || "";
              if (ev.error) {
                handlers.onError(ev.error.message || "خطأ من الخادم");
                return;
              }
            }
            if (delta) {
              full += delta;
              handlers.onText(delta);
            }
          }
        }
      }
      handlers.onDone(full);
    } catch (e) {
      if (e.name === "AbortError") handlers.onDone(full);
      else handlers.onError("تعذّر الاتصال بـ " + P.label.replace(/^[^ ]+ /, "") + " — اتأكد من الإنترنت والمفتاح");
    }
  })();

  return controller;
}

/* ---------- cloud account (Film-trend backend) ---------- */
async function cloudSignup(email) {
  const res = await fetch(backendUrl() + "/signup", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ email }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "signup failed");
  localStorage.setItem("fta_cloud_token", data.token);
  localStorage.setItem("fta_cloud_email", email);
  return data.usage;
}

async function cloudUsage() {
  const token = localStorage.getItem("fta_cloud_token");
  if (!token || !backendUrl()) return null;
  const res = await fetch(backendUrl() + "/me", {
    headers: { authorization: "Bearer " + token },
  });
  if (!res.ok) return null;
  return (await res.json()).usage;
}

/* read a File (PDF) as a base64 string without data: prefix */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ============================================================
   FILM-TREND AI — UI logic
   Tabs: social plan / script / storyboard / settings.
   Streams LLM output (any configured provider) and renders markdown.
   All user-visible strings go through t() (js/i18n.js).
   ============================================================ */

let activeController = null;
let lastScript = "";   // carried from the Script tool into Storyboard

/* ---------- tiny markdown renderer (headings, bold, lists, tables, code) ---------- */
function mdToHtml(md) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const lines = md.split("\n");
  let html = "", inCode = false, inList = false, inTable = false;

  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");

  // dir="auto" makes each block flow by its own language (Arabic → RTL,
  // English prompts → LTR) so mixed output always reads clean.
  const closeBlocks = () => {
    if (inList) { html += "</ul>"; inList = false; }
    if (inTable) { html += "</table></div>"; inTable = false; }
  };

  for (const line of lines) {
    if (line.startsWith("```")) {
      closeBlocks();
      html += inCode ? "</pre>" : "<pre>";
      inCode = !inCode;
      continue;
    }
    if (inCode) { html += esc(line) + "\n"; continue; }

    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { closeBlocks(); html += `<h${h[1].length + 1} dir="auto">${inline(h[2])}</h${h[1].length + 1}>`; continue; }

    if (/^\s*[-*•]\s+/.test(line)) {
      if (inTable) { html += "</table></div>"; inTable = false; }
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li dir="auto">${inline(line.replace(/^\s*[-*•]\s+/, ""))}</li>`;
      continue;
    }

    if (/^\s*\|/.test(line)) {
      if (inList) { html += "</ul>"; inList = false; }
      if (/^\s*\|[\s:|-]+\|\s*$/.test(line)) continue; // separator row
      if (!inTable) { html += '<div class="tblw"><table>'; inTable = true; }
      const cells = line.trim().replace(/^\||\|$/g, "").split("|");
      html += "<tr>" + cells.map(c => `<td dir="auto">${inline(c.trim())}</td>`).join("") + "</tr>";
      continue;
    }

    if (/^\s*(---|━+)\s*$/.test(line)) { closeBlocks(); html += "<hr>"; continue; }
    if (line.trim() === "") { closeBlocks(); continue; }

    closeBlocks();
    html += `<p dir="auto">${inline(line)}</p>`;
  }
  if (inCode) html += "</pre>";
  if (inList) html += "</ul>";
  if (inTable) html += "</table></div>";
  return html;
}

/* ---------- landing / studio views ---------- */
function openStudio() {
  document.body.classList.add("in-studio");
  window.scrollTo(0, 0);
}
function goLanding() {
  document.body.classList.remove("in-studio");
}

/* ---------- stepper tabs ---------- */
function switchTab(name) {
  openStudio();
  document.querySelectorAll(".step-btn").forEach(b =>
    b.classList.toggle("on", b.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p =>
    p.classList.toggle("show", p.id === "panel-" + name));
  window.scrollTo(0, 0);
}

function markStepDone(tool) {
  const btn = document.querySelector(`.step-btn[data-tab="${tool}"]`);
  if (btn) btn.classList.add("done");
}

/* ---------- shared run/render plumbing ---------- */
function checkReady() {
  const { mode, cloudToken, apiKey } = getSettings();
  if (mode === "cloud" ? !cloudToken : !apiKey) {
    toast(mode === "cloud" ? t("t_need_login") : t("t_need_key"));
    switchTab("settings");
    return false;
  }
  return true;
}

function startRun(tool, text) {
  if (!checkReady()) return;
  if (activeController) activeController.abort();

  const out = document.getElementById(`out-${tool}`);
  const btn = document.getElementById(`run-${tool}`);
  const stop = document.getElementById(`stop-${tool}`);
  out.innerHTML = `<p class="thinking">${t("thinking")}</p>`;
  out.dataset.raw = "";
  btn.disabled = true;
  stop.style.display = "inline-flex";

  activeController = runLLM([{ role: "user", text }], {
    onText(delta) {
      out.dataset.raw += delta;
      out.innerHTML = mdToHtml(out.dataset.raw);
      out.scrollTop = out.scrollHeight;
    },
    onDone(full) {
      btn.disabled = false;
      stop.style.display = "none";
      activeController = null;
      if (!full.trim()) {
        out.innerHTML = `<p class="thinking">${t("no_result")}</p>`;
        return;
      }
      out.innerHTML = mdToHtml(full);
      document.getElementById(`actions-${tool}`).style.display = "flex";
      markStepDone(tool);
      if (tool === "board") {
        boardView = "full";
        const sb = document.getElementById("split-board");
        if (sb) sb.textContent = t("split");
      }
      if (tool === "script") {
        lastScript = full;
        const carry = document.getElementById("carry-note");
        if (carry) carry.style.display = "block";
      }
    },
    onError(msg) {
      btn.disabled = false;
      stop.style.display = "none";
      activeController = null;
      out.innerHTML = `<p class="err">⚠️ ${msg}</p>`;
    },
  });
}

function stopRun(tool) {
  if (activeController) activeController.abort();
  document.getElementById(`run-${tool}`).disabled = false;
  document.getElementById(`stop-${tool}`).style.display = "none";
}

function copyOut(tool) {
  navigator.clipboard.writeText(document.getElementById(`out-${tool}`).dataset.raw || "")
    .then(() => toast(t("t_copied")));
}

function downloadOut(tool, name) {
  const blob = new Blob([document.getElementById(`out-${tool}`).dataset.raw || ""], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ============================================================
   STEP 1 — planning CHAT
   The user talks to the model, uploads documents (PDF/Word/PPTX/
   images), asks anything; then asks for the final plan.
   Typing "سيناريو" / "script" navigates to the Script step — the
   model never writes the script inside the chat.
   ============================================================ */
const CHAT_ADDON = `

## INTERACTIVE PLANNING CHAT (currently active)
You are chatting live with the user inside the planning step. Behave like a sharp strategist in a working session:
- Answer questions, brainstorm, refine — short, useful replies (this is a chat, not a report).
- If the user uploads a document, read it, give a 3-5 bullet digest, and ask at most ONE sharp follow-up question.
- Only produce the FULL SOCIAL_PLAN deliverable when the user explicitly asks for the final plan. Until then, keep replies conversational.
- NEVER write a script/screenplay here. If the user asks for the script, reply with one line telling them to press the "Go to Script" button (or type «سيناريو») — the app takes them to the dedicated Script step where they pick format, duration, dialect and more.
- Keep every reply in the user's language.`;

let chatHistory = [];      // neutral messages for the API
let chatBusy = false;
var lastPlanText = "";     // last full assistant reply (for copy/download)
var planReady = false;     // a full plan was delivered
let pendingFile = null;

function chatBubble(role, html) {
  const log = document.getElementById("chat-log");
  const div = document.createElement("div");
  div.className = "msg " + role + (role === "ai" ? " md" : "");
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function chatFilePicked(input) {
  pendingFile = input.files[0] || null;
  document.getElementById("chat-file-chip").textContent = pendingFile ? `📎 ${pendingFile.name}` : "";
}

/* the message is purely "take me to the script step" */
function isScriptIntent(text) {
  return /^["'«»\s]*(سيناريو|اسكريبت|سكريبت|script)[\s!.،؟?«»"']*$/i.test(text);
}

function goToScriptStep() {
  if (planReady && lastPlanText) {
    document.getElementById("plan-link").style.display = "inline-block";
  }
  switchTab("script");
  toast(t("t_to_script"));
}

async function chatSend(preset) {
  if (chatBusy) return;

  const ta = document.getElementById("chat-text");
  let text = (preset || ta.value).trim();
  const file = pendingFile;

  // "سيناريو" / "script" alone → jump straight to the Script step
  if (text && !file && isScriptIntent(text)) {
    ta.value = "";
    goToScriptStep();
    return;
  }

  if (!checkReady()) return;
  if (!text && !file) { toast(t("t_msg_or_file")); return; }

  // the word appears inside a longer message → offer the shortcut button
  if (/سيناريو|سكريبت|script/i.test(text)) {
    document.getElementById("go-script").style.display = "inline-flex";
  }

  chatBusy = true;
  document.getElementById("chat-send").disabled = true;

  // visible bubble (file name only — the extracted content goes to the model)
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  chatBubble("user", esc(text || "…") + (file ? `<div class="chip">📎 ${esc(file.name)}</div>` : ""));
  ta.value = "";
  pendingFile = null;
  document.getElementById("chat-file-chip").textContent = "";
  document.getElementById("chat-file").value = "";

  // extract the attached document locally (works with every provider)
  let images = [];
  if (file) {
    const extracting = chatBubble("ai", `<p class="thinking">${t("t_reading_doc")}</p>`);
    try {
      const doc = await extractDocument(file);
      if (doc.image) images.push(doc.image);
      else text += `\n\n===== ATTACHED DOCUMENT «${file.name}» =====\n${doc.text.slice(0, 60000)}\n===== END OF DOCUMENT =====`;
      extracting.remove();
    } catch (e) {
      extracting.remove();
      chatBubble("ai", `<p class="err">⚠️ ${e.message}</p>`);
      chatBusy = false;
      document.getElementById("chat-send").disabled = false;
      return;
    }
    if (!(preset || "").trim() && !ta.value && text === "") text = "Read this document and summarize the key points.";
  }

  chatHistory.push({ role: "user", text: text || "Read the attachment and analyze it.", images });
  if (chatHistory.length > 16) chatHistory = chatHistory.slice(-16);

  const aiDiv = chatBubble("ai", '<p class="thinking">⏳ …</p>');
  let raw = "";
  activeController = runLLM(chatHistory, {
    onText(d) {
      raw += d;
      aiDiv.innerHTML = mdToHtml(raw);
      const log = document.getElementById("chat-log");
      log.scrollTop = log.scrollHeight;
    },
    onDone(full) {
      chatBusy = false;
      document.getElementById("chat-send").disabled = false;
      activeController = null;
      if (!full.trim()) { aiDiv.innerHTML = `<p class="thinking">${t("no_result")}</p>`; return; }
      aiDiv.innerHTML = mdToHtml(full);
      chatHistory.push({ role: "assistant", text: full });
      lastPlanText = full;
      document.getElementById("actions-plan").style.display = "flex";
      // a full plan was delivered → mark the step and unlock the script shortcut
      if (/30|calendar|جدول/i.test(full) && full.length > 2500) {
        planReady = true;
        markStepDone("plan");
        document.getElementById("go-script").style.display = "inline-flex";
      }
    },
    onError(msg) {
      chatBusy = false;
      document.getElementById("chat-send").disabled = false;
      activeController = null;
      aiDiv.innerHTML = `<p class="err">⚠️ ${msg}</p>`;
    },
  }, { system: SYSTEM_PROMPT + CHAT_ADDON });
}

function chatFinalize() {
  chatSend("تمام — اطلعلي دلوقتي الخطة النهائية الكاملة بكل أقسامها. MODE: SOCIAL_PLAN");
}

function copyPlan() {
  navigator.clipboard.writeText(lastPlanText).then(() => toast(t("t_copied")));
}
function downloadPlan() {
  const blob = new Blob([lastPlanText], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "social-media-plan.md";
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- step 2: script ---------- */
function runScript() {
  const val = id => document.getElementById(id).value.trim();
  const idea = val("script-idea");
  if (!idea) { toast(t("t_idea")); return; }

  const lines = ["MODE: SCRIPT", "FORMAT: " + val("script-format")];
  const add = (label, v) => { if (v) lines.push(label + ": " + v); };
  add("TARGET DURATION", val("script-duration"));
  add("GENRE", val("script-genre"));
  add("TONE", val("script-tone"));
  add("DIALECT", val("script-dialect"));
  add("TARGET AUDIENCE", val("script-audience"));
  add("PLATFORM", val("script-platform"));
  add("CHARACTERS/SETTING", val("script-chars"));
  add("CTA", val("script-cta"));

  let req = lines.join("\n") + "\n\nIDEA:\n" + idea;
  if (planReady && lastPlanText) {
    req += "\n\nPLAN CONTEXT (the approved social media plan — the script must serve it):\n" + lastPlanText.slice(0, 12000);
  }
  startRun("script", req);
}

/* ---------- step 3: storyboard ---------- */
function runBoard() {
  let script = document.getElementById("board-script").value.trim();
  if (!script && lastScript) script = lastScript;
  if (!script) { toast(t("t_script_first")); return; }
  const styleSel = document.getElementById("board-style-sel").value;
  const styleCustom = document.getElementById("board-style").value.trim();
  const style = [styleSel, styleCustom].filter(Boolean).join(", ");
  const ratio = document.getElementById("board-ratio").value;
  const withVO = document.getElementById("board-vo").checked;
  startRun("board",
    `MODE: STORYBOARD\nASPECT RATIO: ${ratio}\nINCLUDE VOICE-OVER: ${withVO ? "yes" : "no"}${style ? "\nVISUAL STYLE: " + style : ""}\n\nSCRIPT:\n${script}`);
}

function useLastScript() {
  if (!lastScript) { toast(t("t_no_script")); return; }
  document.getElementById("board-script").value = lastScript;
  toast(t("t_script_set"));
}

/* ---------- storyboard: split into standalone scene cards ---------- */
let boardView = "full"; // full | scenes

function splitScenes(raw) {
  // scenes are delimited by the machine-parsed header: ━━━ SCENE 04 …
  const parts = raw.split(/(?=━{2,}\s*SCENE\s)/i).filter(p => /━{2,}\s*SCENE\s/i.test(p));
  return parts.map(p => {
    const header = (p.match(/━{2,}\s*(SCENE[^━\n]*)/i) || [, "SCENE"])[1].trim();
    // lookahead stops at the next section: audio note, next scene, another
    // field (possibly **bold**), a code fence, a table row, or a heading
    const stop = "(?=\\n\\s*(?:🔊|━{2,}|\\*{0,2}IMAGE PROMPT|\\*{0,2}MOTION PROMPT|\\*{0,2}VOICE-?OVER|```|\\||#)|$)";
    const grab = label =>
      (p.match(new RegExp(label + "[^:\\n]*:?\\*{0,2}\\s*\\n?([\\s\\S]*?)" + stop, "i")) || [, ""])[1].trim();
    const img = grab("IMAGE PROMPT");
    const mot = grab("MOTION PROMPT");
    const vo = grab("VOICE-?OVER");
    return { header, full: p.trim(), img, mot, vo };
  });
}

function copyText(txt, label) {
  navigator.clipboard.writeText(txt).then(() => toast(label + " — " + t("t_copied")));
}

function scenePromptBlock(i, field, labelKey, copyKey, dir) {
  const s = window._scenes[i];
  if (!s[field]) return "";
  return `
    <div class="scene-prompt">
      <div class="sp-head"><span>${t(labelKey)}</span>
        <button class="btn btn-ghost btn-xs" onclick="copyText(window._scenes[${i}].${field}, t('${copyKey}'))">${t("copy")}</button>
      </div>
      <pre dir="${dir}">${s[field].replace(/&/g, "&amp;").replace(/</g, "&lt;")}</pre>
    </div>`;
}

function toggleBoardView() {
  const out = document.getElementById("out-board");
  const btn = document.getElementById("split-board");
  const raw = out.dataset.raw || "";

  if (boardView === "full") {
    const scenes = splitScenes(raw);
    if (!scenes.length) { toast(t("t_no_scenes")); return; }
    window._scenes = scenes;
    out.innerHTML = scenes.map((s, i) => `
      <div class="scene-card">
        <div class="scene-head">
          <b>🎬 ${s.header.replace(/━/g, "").trim()}</b>
          <button class="btn btn-ghost btn-xs" onclick="copyText(window._scenes[${i}].full, t('copied_scene'))">${t("scene_full")}</button>
        </div>
        ${scenePromptBlock(i, "img", "scene_img", "copied_img", "ltr")}
        ${scenePromptBlock(i, "mot", "scene_mot", "copied_mot", "ltr")}
        ${scenePromptBlock(i, "vo", "scene_vo", "copied_vo", "auto")}
      </div>`).join("");
    btn.textContent = t("split_back");
    boardView = "scenes";
    toast(scenes.length + t("t_scenes_done"));
  } else {
    out.innerHTML = mdToHtml(raw);
    btn.textContent = t("split");
    boardView = "full";
  }
}

/* ---------- step 4: voice-over (Google Gemini TTS) ---------- */
let lastWavUrl = null;

const VO_EXTRACT_SYSTEM = `You are a voice-over script extractor. From the given screenplay, extract ONLY the words that will be spoken aloud (dialogue lines and narration/V.O.), in their original order and original language.
Remove completely: scene headers, action/description lines, camera notes, durations, character name labels, parentheticals, markdown, and any prompts.
Merge the result into clean flowing voice-over text, one paragraph per beat. Return ONLY the spoken text — no titles, no commentary.`;

function useScriptForVoice() {
  if (!lastScript) { toast(t("t_no_script")); return; }
  if (!checkReady()) return;
  const ta = document.getElementById("voice-text");
  const btn = document.getElementById("voice-pull");
  ta.value = "";
  ta.placeholder = t("vo_extracting");
  btn.disabled = true;

  runLLM([{ role: "user", text: "SCRIPT:\n" + lastScript.slice(0, 30000) }], {
    onText(d) { ta.value += d; ta.scrollTop = ta.scrollHeight; },
    onDone(full) {
      btn.disabled = false;
      ta.value = full.trim();
      ta.placeholder = t("v_text_ph");
      if (full.trim()) toast(t("t_vo_ready"));
    },
    onError(msg) {
      btn.disabled = false;
      ta.placeholder = t("v_text_ph");
      toast(msg);
    },
  }, { system: VO_EXTRACT_SYSTEM });
}

async function runVoice() {
  const text = document.getElementById("voice-text").value.trim();
  if (!text) { toast(t("v_write_first")); return; }

  const status = document.getElementById("voice-status");
  const result = document.getElementById("voice-result");
  const btn = document.getElementById("run-voice");
  const voice = document.getElementById("voice-name").value;
  const style = TTS_STYLES[document.getElementById("voice-style").value] || "";

  status.className = "voice-status";
  status.textContent = t("v_generating");
  result.style.display = "none";
  btn.disabled = true;

  try {
    const wav = await ttsGenerate(text, voice, style);
    if (lastWavUrl) URL.revokeObjectURL(lastWavUrl);
    lastWavUrl = URL.createObjectURL(wav);
    document.getElementById("voice-audio").src = lastWavUrl;
    result.style.display = "block";
    status.textContent = t("v_ready");
    markStepDone("voice");
    document.getElementById("voice-dl").onclick = () => {
      const a = document.createElement("a");
      a.href = lastWavUrl;
      a.download = "filmtrend-voiceover.wav";
      a.click();
    };
  } catch (e) {
    status.className = "voice-status err";
    if (e.message === "NO_KEY") {
      status.textContent = t("v_no_key");
      switchTab("settings");
      toast(t("v_add_key_toast"));
    } else if (e.message.startsWith("BAD_KEY")) {
      status.textContent = t("v_bad_key");
    } else if (e.message.startsWith("RATE")) {
      status.textContent = t("v_rate");
    } else {
      status.textContent = t("v_err") + e.message;
    }
  } finally {
    btn.disabled = false;
  }
}

/* ---------- settings ---------- */
function fillProviderUI(provider) {
  const P = PROVIDERS[provider];
  const modelSel = document.getElementById("set-model");
  modelSel.innerHTML = P.models.map(m => `<option value="${m}">${m}</option>`).join("");

  const savedModel = localStorage.getItem("fta_model_" + provider);
  if (savedModel && P.models.includes(savedModel)) modelSel.value = savedModel;

  document.getElementById("set-key").value = localStorage.getItem("fta_key_" + provider) || "";
  document.getElementById("set-custom").value = localStorage.getItem("fta_custom_model_" + provider) || "";
  document.getElementById("key-url") && (document.getElementById("key-url").textContent = P.keyUrl);
  document.getElementById("pdf-note").style.display = P.pdf ? "none" : "block";
}

function persistSettings() {
  const provider = document.getElementById("set-provider").value;
  const key = document.getElementById("set-key").value;
  const model = document.getElementById("set-model").value;
  const custom = document.getElementById("set-custom").value;
  if (!key.trim()) { toast(t("t_key_first")); return; }
  saveSettings(provider, key, model, custom);
  localStorage.setItem("fta_mode", "byok");
  toast(t("t_saved_pre") + PROVIDERS[provider].label);
}

/* ---------- cloud account mode ---------- */
function setMode(mode) {
  localStorage.setItem("fta_mode", mode);
  document.querySelectorAll(".mode-btn").forEach(b =>
    b.classList.toggle("on", b.dataset.mode === mode));
  document.getElementById("cloud-box").style.display = mode === "cloud" ? "block" : "none";
  document.getElementById("byok-box").style.display = mode === "byok" ? "block" : "none";
}

function renderUsage(u) {
  const box = document.getElementById("cloud-usage");
  if (!u) { box.style.display = "none"; return; }
  box.style.display = "block";
  if (u.paid) {
    box.innerHTML = t("usage_paid") + (u.paid_until ? ` (${u.paid_until})` : "");
  } else if (u.active) {
    box.innerHTML = LANG === "ar"
      ? `🎁 <b>التجربة المجانية شغالة</b> — استخدمت <b>${u.used}</b> من <b>${u.limit}</b> توليدة · تنتهي ${u.trial_ends}`
      : `🎁 <b>Free trial active</b> — used <b>${u.used}</b> of <b>${u.limit}</b> generations · ends ${u.trial_ends}`;
  } else {
    box.innerHTML = t("usage_over");
  }
}

async function doCloudSignup() {
  const email = document.getElementById("cloud-email").value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast(t("t_need_email")); return; }
  try {
    const usage = await cloudSignup(email);
    localStorage.setItem("fta_mode", "cloud");
    renderUsage(usage);
    toast(t("t_signup_ok"));
  } catch (e) {
    toast(t("t_signup_fail"));
  }
}

/* ---------- toast ---------- */
let toastEl, toastTimer;
function toast(msg) {
  if (!toastEl) {
    toastEl = document.createElement("div");
    toastEl.className = "toast";
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
}

/* ---------- language: refresh JS-generated strings on toggle ---------- */
function refreshDynamicLang() {
  const noneOpt = document.querySelector('#board-style-sel option[value=""]');
  if (noneOpt) noneOpt.textContent = t("b_style_none");
  const sb = document.getElementById("split-board");
  if (sb) sb.textContent = boardView === "full" ? t("split") : t("split_back");
}
const _baseToggleLang = toggleLang;
toggleLang = function () { _baseToggleLang(); refreshDynamicLang(); };

/* ---------- boot ---------- */
document.addEventListener("DOMContentLoaded", () => {
  applyLang();

  document.querySelectorAll(".step-btn").forEach(b =>
    b.addEventListener("click", () => switchTab(b.dataset.tab)));

  // voice-over: populate the voices list
  document.getElementById("voice-name").innerHTML =
    TTS_VOICES.map(([id, label]) => `<option value="${id}">${label}</option>`).join("");

  // populate provider dropdown from the registry
  const provSel = document.getElementById("set-provider");
  provSel.innerHTML = Object.entries(PROVIDERS)
    .map(([id, p]) => `<option value="${id}">${p.label}</option>`).join("");

  // populate the visual-styles catalogue (grouped)
  const styleSel = document.getElementById("board-style-sel");
  styleSel.innerHTML = `<option value="">${t("b_style_none")}</option>` +
    STYLE_GROUPS.map(g =>
      `<optgroup label="${g.group}">` +
      g.styles.map(([val, label]) => `<option value="${val}">${label}</option>`).join("") +
      `</optgroup>`).join("");

  const { mode, provider, apiKey, cloudToken } = getSettings();
  provSel.value = provider;
  fillProviderUI(provider);
  provSel.addEventListener("change", () => fillProviderUI(provSel.value));

  // cloud mode only appears when the owner has deployed the backend
  if (backendUrl()) {
    document.getElementById("mode-switch").style.display = "flex";
    setMode(mode === "cloud" ? "cloud" : (cloudToken || !apiKey ? "cloud" : "byok"));
    const savedEmail = localStorage.getItem("fta_cloud_email");
    if (savedEmail) document.getElementById("cloud-email").value = savedEmail;
    cloudUsage().then(renderUsage);
  }

  // chat: Enter sends, Shift+Enter = new line
  const chatTa = document.getElementById("chat-text");
  chatTa.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatSend(); }
  });

  // returning users land straight in the studio; new visitors see the landing page
  const ready = (mode === "cloud" && cloudToken) || apiKey;
  if (ready) openStudio();
});

</script>
