<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Film Trend</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f2a33c'/><path d='M12 9l12 7-12 7z' fill='%230b0d12'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <section class="page-hero">
    <div class="wrap">
      <h1>Notes from the cutting room</h1>
      <p>Guides on reference research, colour, camera language and building treatments that sell.</p>
    </div>
  </section>

  <main class="wrap" style="padding-bottom:80px">
    <div class="posts-grid" id="posts"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("posts");
      POSTS.forEach((p, i) => {
        const fake = { id: 900 + i, movie: MOVIES[i % MOVIES.length].slug, comp: ["neon", "closeup", "horizon"][i % 3] };
        const el = document.createElement("a");
        el.className = "post-card";
        el.href = "#";
        el.onclick = e => { e.preventDefault(); toast("Full posts are coming soon — this is a demo build"); };
        el.innerHTML = `
          <div class="cover">${sceneSVG(fake, 4)}</div>
          <div class="body">
            <span class="date">${p.date}</span>
            <h3>${p.title}</h3>
            <p>${p.excerpt}</p>
          </div>`;
        grid.appendChild(el);
      });
    });
  </script>
</body>
</html>
